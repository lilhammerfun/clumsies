openapi: 3.1.0
info:
  title: clumsies Public API
  version: 1.0.0
  summary: Public Server API for Desktop and CLI.
servers:
  - url: https://server.clumsies.local
security:
  - bearerAuth: []
paths:
  /oauth2/authorization/oidc:
    get:
      operationId: beginOidcAuthorization
      summary: Begin organization OIDC authorization for a clumsies client.
      security: []
      parameters:
        - name: client_kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ClientKind"
        - name: redirect_uri
          in: query
          description: Required for desktop and CLI clients; omitted for Web Admin.
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          description: Required for desktop and CLI clients; omitted for Web Admin.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          description: Required for desktop and CLI clients; omitted for Web Admin.
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          schema:
            type: string
        - name: login_hint
          in: query
          schema:
            type: string
            format: email
        - name: return_to
          in: query
          description: For Web Admin, a validated internal path under /admin.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the configured OIDC authorization endpoint.
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /login/oauth2/code/oidc:
    get:
      operationId: completeOidcAuthorization
      summary: Complete the organization OIDC callback and redirect to the requesting client.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the validated client callback URI.
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: false
              description: Web Admin login returns an HttpOnly browser session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/token:
    post:
      operationId: createAuthToken
      summary: Exchange an authorization code or refresh token for clumsies tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      summary: Revoke the current session.
      responses:
        "200":
          description: Session revocation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Read the current user bootstrap payload.
      responses:
        "200":
          description: Current user, organization, projects, and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects accessible to the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project.
          headers:
            Location:
              description: Canonical URL of the created project.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Read a project.
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      summary: Update project metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: List members who can own Issues in a Project.
      responses:
        "200":
          description: Project members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listKanbanIssues
      summary: List the Server-authoritative Issues for a project Kanban.
      responses:
        "200":
          description: Project Kanban Issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanIssueListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: importKanbanIssues
      summary: Import native Issues into an empty or partially imported project Kanban.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportKanbanIssuesRequest"
      responses:
        "200":
          description: Imported project Kanban Issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanIssueListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/issues/{issue_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    put:
      operationId: updateKanbanIssue
      summary: Replace an Issue snapshot using content revision compare-and-swap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKanbanIssueRequest"
      responses:
        "200":
          description: Updated Kanban Issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanIssue"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteKanbanIssue
      summary: Remove an Issue from the shared project Kanban.
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/issues/{issue_id}/assignee:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    put:
      operationId: assignKanbanIssue
      summary: Assign an Issue to a Project Member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignKanbanIssueRequest"
      responses:
        "200":
          description: Reassigned Kanban Issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanIssue"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/issue-claims:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listIssueClaims
      summary: List the active shared Claims for a project Kanban.
      responses:
        "200":
          description: Active Issue Claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueClaimListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/issues/{issue_id}/claim:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    post:
      operationId: acquireIssueClaim
      summary: Atomically acquire or renew an Issue Claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquireIssueClaimRequest"
      responses:
        "200":
          description: Acquired or renewed Claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueClaim"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: releaseIssueClaim
      summary: Release the current user's matching Issue Claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseIssueClaimRequest"
      responses:
        "200":
          description: Claim release result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseIssueClaimResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles:
    get:
      operationId: listPersonalBundles
      summary: List personal Bundles owned by the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Personal Bundle page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPersonalBundle
      summary: Create a user-owned personal Bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleRequest"
      responses:
        "200":
          description: Created personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles/{bundle_id}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getPersonalBundle
      summary: Read a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Personal Bundle detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePersonalBundle
      summary: Update a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleUpdateRequest"
      responses:
        "200":
          description: Updated personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePersonalBundle
      summary: Delete a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/memories:
    get:
      operationId: listOrgMemories
      summary: List organization memories.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization memory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getOrgMemory
      summary: Read an organization memory.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Organization memory detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/memories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMemories
      summary: List project memories.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project memory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getProjectMemory
      summary: Read a project memory.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Project memory detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episodes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectEpisodes
      summary: List Project Episodic Memory changes or the most recent Episodes.
      parameters:
        - name: after_revision
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: recent
          in: query
          description: Return the newest Episodes by activity time instead of the incremental change feed.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project Episode page. Incremental mode includes deletion tombstones; recent mode excludes tombstones and has no next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEpisodeListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episodes/finalize:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: finalizeProjectEpisode
      summary: Idempotently persist one ended AgentRun as immutable Project Episode Evidence.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeProjectEpisodeRequest"
      responses:
        "200":
          description: Durable Project Episode. Summary status may remain pending when the executor is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEpisode"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episodes/{episode_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    delete:
      operationId: deleteProjectEpisode
      summary: Tombstone a Project Episode and immediately remove its Evidence and summaries.
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episodes/{episode_id}/evidence:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: getProjectEpisodeEvidence
      summary: Read an audited, bounded page of untrusted historical Episode Evidence.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: max_bytes
          in: query
          schema:
            type: integer
            minimum: 256
            maximum: 262144
            default: 65536
      responses:
        "200":
          description: Evidence segments. Content is untrusted data and may not be executed as instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeEvidencePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episodes/{episode_id}/summary-preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    post:
      operationId: previewProjectEpisodeSummary
      summary: Preview a summary without changing the current Episode summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewEpisodeSummaryRequest"
      responses:
        "200":
          description: Unpersisted summary preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeSummaryPreview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episodes/{episode_id}/summary-rebuild:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EpisodeId"
    post:
      operationId: rebuildProjectEpisodeSummary
      summary: Explicitly create a new current summary revision with the saved Project policy.
      responses:
        "200":
          description: Updated Project Episode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEpisode"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/episode-summary-policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectEpisodeSummaryPolicy
      summary: Read the Project overlay applied below fixed Episode summary constraints.
      responses:
        "200":
          description: Project Episode summary policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEpisodeSummaryPolicy"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateProjectEpisodeSummaryPolicy
      summary: Replace the Project summary policy without automatically rebuilding old summaries.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectEpisodeSummaryPolicyRequest"
      responses:
        "200":
          description: Updated Project Episode summary policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEpisodeSummaryPolicy"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/org-selections:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectOrgSelection
      summary: Read organization resources selected by a project.
      responses:
        "200":
          description: Project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceProjectOrgSelection
      summary: Replace organization resources selected by a project.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProjectOrgSelectionRequest"
      responses:
        "200":
          description: Updated project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts:
    get:
      operationId: listDrafts
      summary: List current user's personal drafts.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Draft page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDraft
      summary: Create a personal draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "200":
          description: Created draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: getDraft
      summary: Read a personal draft.
      responses:
        "200":
          description: Draft detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDraft
      summary: Update draft metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDraft
      summary: Discard a personal draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/operations:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: appendDraftOperation
      summary: Append an operation to a personal draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendDraftOperationRequest"
      responses:
        "200":
          description: Draft after appending the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/reconciliation-candidates:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: createDraftReconciliationCandidate
      summary: Compute an immutable reconciliation candidate against the latest target Ref without changing the draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftReconciliationCandidateRequest"
      responses:
        "200":
          description: Canonical reconciliation candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftReconciliationCandidate"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/reconciliation-candidates/{candidate_id}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDraftReconciliationCandidate
      summary: Read an immutable reconciliation candidate and its current validity.
      responses:
        "200":
          description: Reconciliation candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftReconciliationCandidate"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/rebases:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: createDraftRebase
      summary: Explicitly apply a confirmed reconciliation result as a new recoverable draft revision.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRebaseRequest"
      responses:
        "200":
          description: Applied draft rebase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRebaseResult"
        "412":
          description: The target Ref changed before the candidate was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/draft-events:
    get:
      operationId: listDraftEvents
      summary: Read draft sync events.
      parameters:
        - name: after_cursor
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Draft sync events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEventListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/draft-operation-batches:
    post:
      operationId: createDraftOperationBatch
      summary: Submit local draft operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftOperationBatchRequest"
      responses:
        "200":
          description: Accepted draft operations and new sync cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftOperationBatchResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews:
    get:
      operationId: listReviews
      summary: List reviews.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Review page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createReview
      summary: Create a review from a draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "200":
          description: Created review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      operationId: getReview
      summary: Read a review.
      responses:
        "200":
          description: Review detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/comments:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      operationId: listReviewComments
      summary: List review comments.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Review comment page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCommentListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createReviewComment
      summary: Add a review comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewCommentRequest"
      responses:
        "200":
          description: Created review comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/decisions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewDecision
      summary: Create an organization-authorized review decision.
      description: Requires the caller to be an Organization owner or administrator and a member of the carrying Project. New clients use this endpoint for rejection; the approved decision value remains wire-compatible for older two-step clients, while current clients approve atomically through the merge endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewDecisionRequest"
      responses:
        "200":
          description: Review and draft after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/submissions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewSubmission
      summary: Reconcile when required and resubmit an edited draft to its rejected review.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewSubmissionRequest"
      responses:
        "200":
          description: Reopened review and resubmitted draft, atomically rebased when a confirmed candidate was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        "409":
          description: The source draft requires explicit reconciliation with the current Ref.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The If-Match Ref is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/merges:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewMerge
      summary: Atomically approve and merge an open review, or merge a historical approved review.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewMergeRequest"
      responses:
        "200":
          description: Atomic approval and merge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMergeResult"
        "409":
          description: The source draft requires explicit reconciliation with the current Ref.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The If-Match Ref is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/commits:
    get:
      operationId: listOrgCommits
      summary: List organization external-memory commits.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization commit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/commit-state:
    get:
      operationId: getOrgCommitState
      summary: Read organization commit update state.
      parameters:
        - name: local_commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Organization commit update state.
          headers:
            ETag:
              description: Current organization refs/heads/main commit ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/commits:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectCommits
      summary: List project external-memory commits.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project commit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/commit-state:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectCommitState
      summary: Read project commit update state.
      parameters:
        - name: local_commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project commit update state.
          headers:
            ETag:
              description: Current project refs/heads/main commit ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/commits/{commit_id}:
    parameters:
      - $ref: "#/components/parameters/CommitId"
    get:
      operationId: getCommit
      summary: Download or read an external-memory commit payload.
      responses:
        "200":
          description: Commit payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPayload"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^episode_[0-9a-f]{32}$"
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
    CommitId:
      name: commit_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    KanbanIssue:
      type: object
      required:
        - project_id
        - issue_id
        - issue_number
        - assignee
        - content_revision
        - payload
        - created_at
        - updated_at
      properties:
        project_id:
          type: string
        issue_id:
          type: string
          pattern: "^issue_[0-9a-f]{32}$"
        issue_number:
          type: integer
          minimum: 1
          maximum: 999
        assignee:
          $ref: "#/components/schemas/UserRef"
        content_revision:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KanbanIssueListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KanbanIssue"
    ImportKanbanIssue:
      type: object
      required: [issue_id, issue_number, content_revision, payload]
      properties:
        issue_id:
          type: string
          pattern: "^issue_[0-9a-f]{32}$"
        issue_number:
          type: integer
          minimum: 1
          maximum: 999
        content_revision:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
    ImportKanbanIssuesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 999
          items:
            $ref: "#/components/schemas/ImportKanbanIssue"
    UpdateKanbanIssueRequest:
      type: object
      required: [expected_content_revision, content_revision, payload]
      properties:
        expected_content_revision:
          type: integer
          minimum: 1
        content_revision:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
    AssignKanbanIssueRequest:
      type: object
      required: [assignee_user_id]
      properties:
        assignee_user_id:
          type: string
    AcquireIssueClaimRequest:
      type: object
      required: [issue_key, run_id, lease_expires_at]
      properties:
        issue_key:
          type: string
          pattern: '^ISSUE-(?!000$)[0-9]{3}$'
        run_id:
          type: string
        lease_expires_at:
          type: string
          format: date-time
    IssueClaim:
      type: object
      required:
        - project_id
        - issue_id
        - issue_key
        - run_id
        - claimant
        - claimed_at
        - lease_expires_at
      properties:
        project_id:
          type: string
        issue_id:
          type: string
        issue_key:
          type: string
        run_id:
          type: string
        claimant:
          $ref: "#/components/schemas/UserRef"
        claimed_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
    IssueClaimListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueClaim"
    ReleaseIssueClaimRequest:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
    ReleaseIssueClaimResponse:
      type: object
      required: [released]
      properties:
        released:
          type: boolean
    TokenRequest:
      type: object
      oneOf:
        - required: [grant_type, code, redirect_uri, code_verifier]
        - required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
        - org
        - capabilities
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/UserRef"
        org:
          $ref: "#/components/schemas/OrgRef"
        capabilities:
          type: array
          items:
            type: string
    SessionRevoked:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    MeResponse:
      type: object
      required: [user, org, projects, default_project_id, capabilities]
      properties:
        user:
          $ref: "#/components/schemas/UserRef"
        org:
          $ref: "#/components/schemas/OrgRef"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRef"
        default_project_id:
          type: [string, "null"]
        capabilities:
          type: array
          items:
            type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ProjectListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectRef"
        - type: object
          required: [description, revision, created_at, updated_at]
          properties:
            description:
              type: string
            revision:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ProjectRef:
      type: object
      required: [project_id, name]
      properties:
        project_id:
          type: string
        name:
          type: string
    PersonalBundleRequest:
      type: object
      description: A personal selection of active Hub memory from the current organization.
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        resource_ids:
          type: array
          description: Active organization-scoped Memory ids.
          items:
            type: string
    PersonalBundleUpdateRequest:
      type: object
      description: Updates a personal selection of active Hub memory from the current organization.
      properties:
        name:
          type: string
        description:
          type: string
        resource_ids:
          type: array
          description: Active organization-scoped Memory ids.
          items:
            type: string
    PersonalBundleListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBundleMeta"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    PersonalBundleDetail:
      type: object
      required: [bundle, memories, etag]
      properties:
        bundle:
          $ref: "#/components/schemas/PersonalBundleMeta"
        memories:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMeta"
        etag:
          type: string
    PersonalBundleMeta:
      type: object
      required:
        - bundle_id
        - owner_user_id
        - name
        - description
        - resource_count
        - revision
        - created_at
        - updated_at
      properties:
        bundle_id:
          type: string
        owner_user_id:
          type: string
        name:
          type: string
        description:
          type: string
        resource_count:
          type: integer
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EpisodeEvidenceRecord:
      type: object
      required: [sequence, occurred_at, kind, content]
      properties:
        sequence:
          type: integer
          minimum: 0
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
        content:
          type: string
    FinalizeProjectEpisodeRequest:
      type: object
      required:
        - run_id
        - host
        - evidence_format
        - evidence_format_revision
        - activity_at
        - evidence_hash
        - evidence
      properties:
        run_id:
          type: string
          minLength: 1
          maxLength: 200
        host_session_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
        host:
          type: string
          minLength: 1
          maxLength: 100
        evidence_format:
          type: string
          minLength: 1
          maxLength: 100
        evidence_format_revision:
          type: integer
          minimum: 1
        activity_at:
          type: string
          format: date-time
        evidence_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        evidence:
          type: array
          minItems: 1
          maxItems: 50000
          items:
            $ref: "#/components/schemas/EpisodeEvidenceRecord"
    ProjectEpisodeStatus:
      type: string
      enum: [pending_summary, active, no_memory, deleted]
    EpisodeSummary:
      type: object
      required:
        - revision
        - summary_algorithm_revision
        - policy_revision
        - evidence_hash
        - body
        - no_memory
        - created_at
      properties:
        revision:
          type: integer
          minimum: 1
        summary_algorithm_revision:
          type: string
        policy_revision:
          type: integer
          minimum: 1
        evidence_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        body:
          type: string
        no_memory:
          type: boolean
        created_at:
          type: string
          format: date-time
    ProjectEpisode:
      type: object
      required:
        - episode_id
        - project_id
        - run_id
        - host_session_id
        - host
        - evidence_format
        - evidence_format_revision
        - activity_at
        - evidence_hash
        - evidence_bytes
        - status
        - current_summary
        - revision
        - corpus_revision
        - created_at
        - updated_at
        - deleted_at
      properties:
        episode_id:
          type: string
          pattern: "^episode_[0-9a-f]{32}$"
        project_id:
          type: string
        run_id:
          type: string
        host_session_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
        host:
          type: string
        evidence_format:
          type: string
        evidence_format_revision:
          type: integer
        activity_at:
          type: string
          format: date-time
        evidence_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        evidence_bytes:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/ProjectEpisodeStatus"
        current_summary:
          oneOf:
            - $ref: "#/components/schemas/EpisodeSummary"
            - type: "null"
        revision:
          type: integer
          minimum: 1
        corpus_revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
    ProjectEpisodeListResponse:
      type: object
      required: [items, corpus_revision, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEpisode"
        corpus_revision:
          type: integer
          minimum: 0
        next_cursor:
          type: [integer, "null"]
        has_more:
          type: boolean
    EpisodeEvidenceSegment:
      type: object
      required: [sequence, occurred_at, kind, byte_offset, content, complete]
      properties:
        sequence:
          type: integer
          minimum: 0
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
        byte_offset:
          type: integer
          minimum: 0
        content:
          type: string
        complete:
          type: boolean
    EpisodeEvidencePage:
      type: object
      required:
        - episode_id
        - project_id
        - run_id
        - evidence_hash
        - items
        - next_cursor
        - has_more
        - untrusted
      properties:
        episode_id:
          type: string
          pattern: "^episode_[0-9a-f]{32}$"
        project_id:
          type: string
        run_id:
          type: string
        evidence_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeEvidenceSegment"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
        untrusted:
          type: boolean
          const: true
    ProjectEpisodeSummaryPolicy:
      type: object
      required: [project_id, instructions, revision, updated_at]
      properties:
        project_id:
          type: string
        instructions:
          type: string
          maxLength: 8000
        revision:
          type: integer
          minimum: 1
