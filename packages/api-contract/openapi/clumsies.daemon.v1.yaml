openapi: 3.1.0
info:
  title: clumsies Local Daemon IPC Schema
  version: 1.0.0
  summary: Schema-only local daemon IPC contract for local daemon clients.
security: []
paths: {}
components:
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    DaemonIpcTransport:
      type: string
      enum: [macos_xpc_mach_service]
    DaemonIpcEndpoint:
      type: object
      required: [transport, service_name]
      properties:
        transport:
          $ref: "#/components/schemas/DaemonIpcTransport"
        service_name:
          type: string
    DaemonIpcRequest:
      type: object
      required: [method, payload]
      properties:
        method:
          $ref: "#/components/schemas/DaemonIpcMethod"
        payload:
          type: object
          additionalProperties: true
        agent_runtime:
          $ref: "#/components/schemas/AgentRuntimeIdentity"
          description: Present only for short-lived Agent protocol proxies; Desktop and other resident clients omit it.
    DaemonIpcResponse:
      type: object
      required: [ok, payload, error]
      properties:
        ok:
          type: boolean
        payload:
          type: object
          additionalProperties: true
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    DaemonIpcMethod:
      type: string
      enum:
        - health
        - project_config
        - replace_project_config
        - select_project
        - resolve_project_binding
        - list_project_bindings
        - replace_project_binding
        - remove_project_binding
        - list_project_agent_adapters
        - list_all_project_agent_adapters
        - inspect_legacy_agent_adapters
        - install_project_agent_adapter
        - remove_project_agent_adapter
        - sync_status
        - project_storage
        - replace_project_storage
        - project_storage_move
        - reset_project_storage
        - clear_project_cache
        - memory_cache
        - project_checkout
        - activate_memory
        - load_memory
        - get_episode_evidence
        - record_agent_run_event
        - list_issue_board
        - desktop_list_issue_board
        - get_issue_detail
        - desktop_get_issue_detail
        - get_issue
        - export_issue
        - create_issue
        - update_issue
        - apply_issue_gate
        - set_verification_step_completed
        - unclaim_issue
        - desktop_unclaim_issue
        - remove_issue
        - start_issue_work
        - request_issue_closure
        - pause_issue
        - resume_issue
        - search_index_status
        - rebuild_search_index
        - list_retrieval_runs
        - get_retrieval_run
        - create_evaluation_case
        - resolve_evaluation_case
        - clear_retrieval_runs
        - export_evaluation_set
        - retry_sync
        - mcp_status
        - list_drafts
        - get_draft
        - store_draft_operation
        - desktop_store_draft_operation
        - server_request
    DaemonBootstrapStatus:
      type: object
      required:
        - label
        - mach_service_name
        - plist_path
        - installed
        - endpoint
        - runtime
      properties:
        label:
          type: string
        mach_service_name:
          type: string
        plist_path:
          type: string
        installed:
          type: boolean
        endpoint:
          $ref: "#/components/schemas/DaemonIpcEndpoint"
        runtime:
          $ref: "#/components/schemas/LaunchAgentRuntimeStatus"
    LaunchAgentRuntimeStatus:
      type: object
      required:
        - installed
        - bootstrapped
        - running
        - pid
        - state
        - last_exit_code
        - last_error
      properties:
        installed:
          type: boolean
        bootstrapped:
          type: boolean
        running:
          type: boolean
        pid:
          type: [integer, "null"]
        state:
          type: [string, "null"]
        last_exit_code:
          type: [integer, "null"]
        last_error:
          type: [string, "null"]
    DaemonProjectConfig:
      type: object
      required:
        - server_url
        - project_id
        - has_access_token
        - has_refresh_token
        - ready
        - missing_fields
      properties:
        server_url:
          type: string
          format: uri
        project_id:
          type: [string, "null"]
        has_access_token:
          type: boolean
          description: Whether the daemon loaded an access token from macOS Keychain.
        has_refresh_token:
          type: boolean
          description: Whether the daemon loaded a refresh token from macOS Keychain.
        ready:
          type: boolean
        missing_fields:
          type: array
          items:
            type: string
    DaemonProjectConfigUpdateRequest:
      type: object
      required: [server_url, project_id, access_token, refresh_token]
      properties:
        server_url:
          type: string
          format: uri
        project_id:
          type: [string, "null"]
        access_token:
          type: [string, "null"]
          description: Written directly to macOS Keychain and never returned by daemon APIs.
        refresh_token:
          type: [string, "null"]
          description: Written atomically with the access token to macOS Keychain and never returned.
    DaemonProjectSelectionRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonProjectBindingResolveRequest:
      type: object
      required: [workspace_path]
      properties:
        workspace_path:
          type: string
          description: Existing local path whose nearest bound ancestor should be resolved.
    DaemonProjectBindingListRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
          description: Canonical Server Project whose local repository bindings should be listed.
    DaemonProjectBindingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DaemonProjectBinding"
    DaemonProjectBindingReplaceRequest:
      type: object
      required: [workspace_root, project_id, expected_revision]
      properties:
        workspace_root:
          type: string
          description: Existing local directory to bind after canonical filesystem resolution.
        project_id:
          type: string
          description: Canonical Server Project identifier accessible to the signed-in user.
        expected_revision:
          type: [integer, "null"]
          minimum: 1
          description: Current binding revision for replacement; null creates a binding idempotently.
    DaemonProjectBindingRemoveRequest:
      type: object
      required: [workspace_root, expected_revision]
      properties:
        workspace_root:
          type: string
        expected_revision:
          type: integer
          minimum: 1
    DaemonProjectBindingRemoveResponse:
      type: object
      required: [workspace_root, removed]
      properties:
        workspace_root:
          type: string
        removed:
          type: boolean
    DaemonProjectBinding:
      type: object
      required:
        - server_url
        - workspace_root
        - project_id
        - revision
        - created_at
        - updated_at
      properties:
        server_url:
          type: string
          format: uri
        workspace_root:
          type: string
        project_id:
          type: string
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DaemonProjectAgentAdapterListRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonLegacyAgentAdapterInspectionRequest:
      type: object
      required: [runtime_binary_path]
      properties:
        runtime_binary_path:
          type: string
          description: Compatibility field retained for existing Apps and daemons; ignored by this read-only operation.
    DaemonLegacyAgentAdapterConflict:
      type: object
      required: [install_id, adapter, scope, target_root, code, message]
      properties:
        install_id:
          type: string
        adapter:
          $ref: "#/components/schemas/ProjectAgentAdapterKind"
        scope:
          type: string
          enum: [workspace, user, repo, unknown]
        target_root:
          type: string
        code:
          type: string
        message:
          type: string
    DaemonLegacyAgentAdapterInspectionResponse:
      type: object
      description: Read-only discovery result; archived Zig installations are never adopted implicitly.
      required: [scanned, deferred, conflicts]
      properties:
        scanned:
          type: integer
          minimum: 0
        deferred:
          type: integer
          minimum: 0
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/DaemonLegacyAgentAdapterConflict"
    DaemonProjectAgentAdapterInstallRequest:
      type: object
      required:
        - project_id
        - workspace_root
        - adapter
        - runtime_binary_path
        - expected_revision
      properties:
        project_id:
          type: string
        workspace_root:
          type: string
        adapter:
          $ref: "#/components/schemas/ProjectAgentAdapterKind"
        runtime_binary_path:
          type: string
          description: Signed App-bundled clumsiesd Agent runtime executable.
        expected_revision:
          type: [integer, "null"]
          minimum: 1
    DaemonProjectAgentAdapterRemoveRequest:
      type: object
      required: [workspace_root, adapter, expected_revision]
      properties:
        workspace_root:
          type: string
        adapter:
          $ref: "#/components/schemas/ProjectAgentAdapterKind"
        expected_revision:
          type: integer
          minimum: 1
    DaemonProjectAgentAdapterRemoveResponse:
      type: object
      required: [workspace_root, adapter, removed]
      properties:
        workspace_root:
          type: string
        adapter:
          $ref: "#/components/schemas/ProjectAgentAdapterKind"
        removed:
          type: boolean
    DaemonProjectAgentAdapter:
      type: object
      required:
        - server_url
        - project_id
        - workspace_root
        - adapter
        - revision
        - managed_files
        - created_at
        - updated_at
      properties:
        server_url:
          type: string
          format: uri
        project_id:
          type: string
        workspace_root:
          type: string
        adapter:
          $ref: "#/components/schemas/ProjectAgentAdapterKind"
        revision:
          type: integer
          minimum: 1
        managed_files:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DaemonProjectAgentAdapterListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DaemonProjectAgentAdapter"
    DaemonProjectStorageRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonProjectStorageMoveRequest:
      type: object
      required: [move_id]
      properties:
        move_id:
          type: string
    DaemonProjectStorageReplaceRequest:
      type: object
      required: [project_id, selected_root_path, handoff_bookmark_data, expected_location_revision]
      properties:
        project_id:
          type: string
        selected_root_path:
          type: string
          description: Canonical display path selected by the user; daemon validates it against the handoff bookmark.
        handoff_bookmark_data:
          type: string
          format: byte
          description: Base64-encoded one-time macOS bookmark used by Desktop to hand the selected directory to daemon. Daemon replaces it with its own security-scoped bookmark and never persists this value.
        expected_location_revision:
          type: integer
          minimum: 1
    DaemonProjectStorageResetRequest:
      type: object
      required: [project_id, expected_location_revision]
      properties:
        project_id:
          type: string
        expected_location_revision:
          type: integer
          minimum: 1
    DaemonProjectCacheClearRequest:
      type: object
      required: [project_id, expected_location_revision]
      properties:
        project_id:
          type: string
        expected_location_revision:
          type: integer
          minimum: 1
    DaemonProjectStorage:
      type: object
      required:
        - authority_key
        - project_id
        - mode
        - selected_root_path
        - managed_root_path
        - active_generation_path
        - search_index_path
        - availability
        - location_revision
        - size_bytes
        - active_move_id
        - issue_code
        - diagnostic
      properties:
        authority_key:
          type: string
          format: uri
        project_id:
          type: string
        mode:
          $ref: "#/components/schemas/DaemonProjectStorageMode"
        selected_root_path:
          type: string
        managed_root_path:
          type: string
        active_generation_path:
          type: [string, "null"]
        search_index_path:
          type: string
        availability:
          $ref: "#/components/schemas/DaemonProjectStorageAvailability"
        location_revision:
          type: integer
          minimum: 1
        size_bytes:
          type: integer
          minimum: 0
        active_move_id:
          type: [string, "null"]
        issue_code:
          type: [string, "null"]
        diagnostic:
          type: [string, "null"]
    DaemonProjectStorageMove:
      type: object
      required:
        - move_id
        - project_id
        - source_mode
        - destination_mode
        - source_managed_root_path
        - destination_managed_root_path
        - source_location_revision
        - state
        - error_code
        - error_message
        - created_at
        - updated_at
        - completed_at
      properties:
        move_id:
          type: string
        project_id:
          type: string
        source_mode:
          $ref: "#/components/schemas/DaemonProjectStorageMode"
        destination_mode:
          $ref: "#/components/schemas/DaemonProjectStorageMode"
        source_managed_root_path:
          type: string
        destination_managed_root_path:
          type: string
        source_location_revision:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/DaemonProjectStorageMoveState"
        error_code:
          type: [string, "null"]
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    DaemonMemoryCacheRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonMemoryCacheStatus:
      type: object
      required: [project_id, commit_id, active_generation_path, state, diagnostic]
      properties:
        project_id:
          type: string
        commit_id:
          type: [string, "null"]
        active_generation_path:
          type: [string, "null"]
        state:
          $ref: "#/components/schemas/DaemonMemoryCacheState"
        diagnostic:
          type: [string, "null"]
    DaemonProjectCheckoutRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonProjectCheckout:
      type: object
      required:
        - project_id
        - commit_id
        - ref_etag
        - commit_created_at
        - org_selection_revision
        - selected_org_resource_ids
        - resources
        - ready
      properties:
        project_id:
          type: string
        commit_id:
          type: [string, "null"]
        ref_etag:
          type: [string, "null"]
        commit_created_at:
          type: [string, "null"]
          format: date-time
        org_selection_revision:
          type: integer
        selected_org_resource_ids:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/DaemonProjectCheckoutResource"
        ready:
          type: boolean
    DaemonProjectCheckoutResource:
      type: object
      required:
        - resource_id
        - scope
        - resource_kind
        - project_id
        - path
        - content_hash
        - content
      properties:
        resource_id:
          type: string
        scope:
          $ref: "#/components/schemas/DaemonDraftScope"
        resource_kind:
          $ref: "#/components/schemas/DaemonDraftResourceKind"
        project_id:
          type: [string, "null"]
        path:
          type: string
        content_hash:
          type: string
        content:
          $ref: "#/components/schemas/DaemonDraftContent"
    RecordAgentRunEventRequest:
      type: object
      required:
        - event_id
        - project_id
        - host
        - host_run_key
        - event_type
        - source
        - host_session_id
        - parent_run_id
        - parent_host_run_key
        - kind
        - issue_key
        - outcome
        - display_label
        - summary
        - occurred_at
      properties:
        event_id:
          type: string
        project_id:
          type: string
        host:
          $ref: "#/components/schemas/AgentRunHost"
        host_run_key:
          type: [string, "null"]
          description: Null only for a host-session-wide event such as session_ended.
        event_type:
          $ref: "#/components/schemas/AgentRunEventType"
        source:
          $ref: "#/components/schemas/AgentRunEventSource"
        host_session_id:
          type: [string, "null"]
        parent_run_id:
          type: [string, "null"]
        parent_host_run_key:
          type: [string, "null"]
          description: Host key used to resolve a parent run before its daemon run id is known.
        kind:
          oneOf:
            - $ref: "#/components/schemas/AgentRunKind"
            - type: "null"
        issue_key:
          type: [string, "null"]
          pattern: "^ISSUE-(?!000$)[0-9]{3}$"
        outcome:
          oneOf:
            - $ref: "#/components/schemas/AgentRunOutcome"
            - type: "null"
        display_label:
          type: [string, "null"]
          maxLength: 160
        summary:
          type: [string, "null"]
          maxLength: 1000
        occurred_at:
          type: [string, "null"]
          format: date-time
    RecordAgentRunEventResponse:
      type: object
      required: [run, affected_runs, duplicate]
      properties:
        run:
          description: Null for a host-session-wide event that affects multiple runs.
          oneOf:
            - $ref: "#/components/schemas/AgentRun"
            - type: "null"
        affected_runs:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        duplicate:
          type: boolean
    IssueBoardListRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    IssueDetailRequest:
      type: object
      required: [project_id, issue_number]
      properties:
        project_id:
          type: string
        issue_number:
          type: integer
          minimum: 1
          maximum: 999
    GetIssueRequest:
      type: object
      required: [issue_id]
      properties:
        issue_id:
          type: string
          pattern: "^issue_[0-9a-f]{32}$"
          description: Globally unique Issue identifier, independent of project scope.
    IssueDetailResponse:
      type: object
      required: [issue, body, acceptance_criteria]
      properties:
        issue:
          $ref: "#/components/schemas/IssueBoardCard"
        body:
          type: string
        acceptance_criteria:
          type: array
          items:
            type: string
    IssueBoardResponse:
      type: object
      required: [project_id, effective_hash, issues, claims, unlinked_runs, diagnostics]
      properties:
        project_id:
          type: string
        effective_hash:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueBoardCard"
        claims:
          type: array
          items:
            $ref: "#/components/schemas/IssueClaim"
        unlinked_runs:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/IssueBoardDiagnostic"
    IssueMember:
      type: object
      required: [user_id, email, display_name, avatar_url, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          format: uri
        role:
          type: string
    IssueClaim:
      type: object
      required:
        - project_id
        - issue_id
        - issue_key
        - run_id
        - claimant
        - claimed_at
        - lease_expires_at
      properties:
        project_id:
          type: string
        issue_id:
          type: string
        issue_key:
          type: string
        run_id:
          type: string
        claimant:
          $ref: "#/components/schemas/IssueMember"
        claimed_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
    IssueExternalReference:
      type: object
      required: [kind, url]
      properties:
        kind:
          $ref: "#/components/schemas/IssueExternalReferenceKind"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Absolute HTTP(S) URL without embedded credentials.
    IssueBlockingFactKind:
      type: string
      enum: [host_capability, external]
    IssueBlockingFact:
      type: object
      required: [fact_id, kind, description, satisfied]
      properties:
        fact_id:
          type: string
        kind:
          $ref: "#/components/schemas/IssueBlockingFactKind"
        value:
          type: [string, "null"]
        description:
          type: string
        satisfied:
          type: boolean
    IssueBlockingReasonKind:
      type: string
      enum: [dependency, fact]
    IssueBlockingReason:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/IssueBlockingReasonKind"
        issue_key:
          type: [string, "null"]
        title:
          type: [string, "null"]
        board_state:
          oneOf:
            - $ref: "#/components/schemas/IssueBoardState"
            - type: "null"
        fact_id:
          type: [string, "null"]
        description:
          type: [string, "null"]
    IssueDependencyState:
      type: object
      required: [issue_key, title, board_state]
      properties:
        issue_key:
          type: string
        title:
          type: string
        board_state:
          $ref: "#/components/schemas/IssueBoardState"
    IssueBoardCard:
      type: object
      required:
        - issue_id
        - project_id
        - issue_number
        - issue_key
        - resource_id
        - path
        - lifecycle
        - title
        - description
        - external_references
        - found_at
        - created_at
        - started_at
        - closed_at
        - archived_at
        - content_hash
        - source_commit_id
        - draft_id
        - draft_revision
        - board_state
        - state_revision
        - state_updated_at
        - closure_summary
        - assignee
        - is_stale
        - blocked
        - blocking_reasons
        - dependencies
        - blocking_facts
        - active_runs
        - latest_run
        - changed_by_run_id
        - verification_level
        - verification_steps
        - state_events
      properties:
        issue_id:
          type: string
          pattern: "^issue_[0-9a-f]{32}$"
        project_id:
          type: string
        issue_number:
          type: integer
          minimum: 1
        issue_key:
          type: string
          pattern: "^ISSUE-(?!000$)[0-9]{3}$"
        resource_id:
          type: string
        path:
          type: string
        lifecycle:
          $ref: "#/components/schemas/IssueLifecycle"
        title:
          type: string
        description:
          type: string
        description_excerpt:
          type: string
        external_references:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/IssueExternalReference"
        found_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: [string, "null"]
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        content_hash:
          type: string
        source_commit_id:
          type: [string, "null"]
        draft_id:
          type: [string, "null"]
        draft_revision:
          type: [string, "null"]
        board_state:
          $ref: "#/components/schemas/IssueBoardState"
        state_revision:
          type: integer
          minimum: 1
        state_updated_at:
          type: [string, "null"]
          format: date-time
        closure_summary:
          type: [string, "null"]
          maxLength: 1000
        assignee:
          oneOf:
            - $ref: "#/components/schemas/IssueMember"
            - type: "null"
        is_stale:
          type: boolean
        blocked:
          type: boolean
        blocking_reasons:
          type: array
          items:
            $ref: "#/components/schemas/IssueBlockingReason"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/IssueDependencyState"
        blocking_facts:
          type: array
          items:
            $ref: "#/components/schemas/IssueBlockingFact"
        active_runs:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
