          $ref: "#/components/schemas/DraftOperationSyncStatus"
        last_error:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DaemonDraftOperationRequest:
      type: object
      required: [project_id, scope, resource, op]
      properties:
        draft_id:
          type: [string, "null"]
        base_commit_id:
          type: [string, "null"]
        project_id:
          type: string
        scope:
          $ref: "#/components/schemas/DaemonDraftScope"
        resource:
          $ref: "#/components/schemas/DaemonDraftResourceKind"
        op:
          $ref: "#/components/schemas/DaemonDraftOperation"
        source:
          $ref: "#/components/schemas/DaemonDraftOperationSource"
    DaemonDraftOperation:
      type: object
      oneOf:
        - required: [create]
        - required: [update]
        - required: [rename]
        - required: [delete]
        - required: [discard]
      properties:
        create:
          $ref: "#/components/schemas/DaemonCreateDraftOperation"
        update:
          $ref: "#/components/schemas/DaemonUpdateDraftOperation"
        rename:
          $ref: "#/components/schemas/DaemonRenameDraftOperation"
        delete:
          $ref: "#/components/schemas/DaemonDeleteDraftOperation"
        discard:
          $ref: "#/components/schemas/DaemonDiscardDraftOperation"
    DaemonCreateDraftOperation:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          description: Portable normalized relative resource path using slash separators.
        content:
          $ref: "#/components/schemas/DaemonDraftContent"
        description:
          type: string
    DaemonUpdateDraftOperation:
      oneOf:
        - $ref: "#/components/schemas/DaemonContentDraftUpdate"
        - $ref: "#/components/schemas/DaemonTextDraftUpdate"
    DaemonContentDraftUpdate:
      type: object
      additionalProperties: false
      required: [id, content]
      properties:
        id:
          type: string
        content:
          $ref: "#/components/schemas/DaemonDraftContent"
        description:
          type: string
    DaemonTextDraftUpdate:
      type: object
      additionalProperties: false
      required: [id, expected_hash, replacements]
      properties:
        id:
          type: string
          minLength: 1
          description: Stable resource ID returned by load_memory, not a path.
        expected_hash:
          type: string
          minLength: 1
          description: Complete Effective Memory content hash returned by load_memory.
        replacements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DaemonTextReplacement"
        description:
          type: string
    DaemonTextReplacement:
      type: object
      additionalProperties: false
      required: [old_text, new_text]
      properties:
        old_text:
          type: string
          minLength: 1
        new_text:
          type: string
    DaemonDraftContent:
      type: object
      required: [content]
      properties:
        description:
          type: [string, "null"]
          description: Optional semantic summary updated with the content.
        content:
          type: string
          minLength: 1
    DaemonRenameDraftOperation:
      type: object
      required: [id, new_path]
      properties:
        id:
          type: string
        new_path:
          type: string
          minLength: 1
          description: Portable normalized relative path used by the rename operation.
        description:
          type: string
    DaemonDeleteDraftOperation:
      type: object
      required: [id]
      properties:
        id:
          type: string
        description:
          type: string
    DaemonDiscardDraftOperation:
      type: object
      required: [id]
      properties:
        id:
          type: string
    DaemonDraftOperationResponse:
      type: object
      required: [local_operation_id, draft_id, queued, sync_status]
      properties:
        local_operation_id:
          type: string
        draft_id:
          type: string
        queued:
          type: boolean
        sync_status:
          $ref: "#/components/schemas/DraftOperationSyncStatus"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    SyncState:
      type: string
      enum: [idle, queued, syncing, retrying, degraded, failed]
    DaemonDraftResourceKind:
      type: string
      enum: [memory]
    DaemonDraftScope:
      type: string
      enum: [org, project]
    DaemonLocalDraftStatus:
      type: string
      enum: [open, submitted, merged, discarded]
    DaemonDraftFreshness:
      type: string
      enum: [current, behind]
    DaemonDraftReconciliationStatus:
      type: string
      enum: [unknown, clean, conflicts]
    DaemonMemoryCacheState:
      type: string
      enum: [project_ref_not_synced, storage_unavailable, generation_missing, generation_corrupt, ready]
    DaemonProjectStorageMode:
      type: string
      enum: [default, custom]
    DaemonProjectStorageAvailability:
      type: string
      enum: [ready, moving, unavailable]
    DaemonProjectStorageMoveState:
      type: string
      enum: [preparing, materializing, verifying, switching, cleaning, completed, failed]
    ProjectAgentAdapterKind:
      type: string
      enum: [codex, claude-code, opencode, dsh, antigravity]
    AgentRunHost:
      type: string
      enum: [codex, claude-code, zed, manual, opencode, dsh, antigravity]
    AgentRunKind:
      type: string
      enum: [root, subagent]
    AgentRunPhase:
      type: string
      enum: [running, ended]
    AgentRunOutcome:
      type: string
      enum: [completed, blocked, failed, cancelled, unknown]
    AgentRunEventType:
      type: string
      enum: [started, heartbeat, ended, session_ended]
    AgentRunEventSource:
      type: string
      enum: [hook, mcp, desktop, recovery]
    IssueLifecycle:
      type: string
      enum: [open, closed]
    IssueBoardState:
      type: string
      enum: [todo, in_progress, paused, in_review, done]
    IssueExternalReferenceKind:
      type: string
      enum: [issue, pull_request]
    IssueGateAction:
      type: string
      enum: [approve_closure, request_changes, reopen]
    IssueStateEvent:
      type: object
      properties:
        from_state:
          $ref: "#/components/schemas/IssueBoardState"
        to_state:
          $ref: "#/components/schemas/IssueBoardState"
        changed_by_run_id:
          type: string
          nullable: true
        occurred_at:
          type: string
      required: [from_state, to_state, occurred_at]
    VerificationStep:
      type: object
      properties:
        text:
          type: string
        completed:
          type: boolean
          default: false
      required: [text]
    VerificationLevel:
      type: string
      enum: [agent_self, human_required, mixed]
    IssueRemovalAction:
      type: string
      enum: [archive, delete]
    IssueBoardDiagnosticCode:
      type: string
      enum: [malformed_path, malformed_title, title_number_mismatch, duplicate_issue_number]
    RetrievalRunStatus:
      type: string
      enum: [running, succeeded, failed]
    RetrievalExclusionReason:
      type: string
      enum:
        - selected
        - below_relevance
        - overlap
        - per_resource_limit
        - token_budget
        - fragment_limit
        - not_reranked
    RetrievalDeltaAction:
      type: string
      enum: [add, replace, reuse]
    DaemonDraftOperationSource:
      type: string
      enum: [desktop, cli, mcp_store]
    DaemonDraftOperationRecordSource:
      type: string
      enum: [desktop, cli, mcp_store, server]
    DraftOperationSyncStatus:
      type: string
      enum: [queued, syncing, retrying, synced, failed]
