name: Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CLUMSIES_AGENT_RUNTIME_BUILD_ID: desktop-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev libasound2-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Check and test the actual desktop crate
        run: |
          cargo fmt -p desktop --check
          cargo test --locked -p desktop
      - name: Build bundled client and daemon
        run: cargo build --locked --release -p desktop -p clumsiesd
      - name: Check runtime dependencies
        run: |
          ldd target/release/clumsies-desktop | tee /tmp/client-dependencies
          ldd target/release/clumsiesd | tee /tmp/daemon-dependencies
          ! grep 'not found' /tmp/client-dependencies /tmp/daemon-dependencies
      - name: Assemble the package
        run: |
          VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          apps/desktop/packaging/assemble-linux.sh "$VERSION" target/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: clumsies-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            target/release/clumsies-desktop
            target/release/clumsiesd
          if-no-files-found: error


  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CLUMSIES_AGENT_RUNTIME_BUILD_ID: desktop-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Test Windows IPC, credential vault and Codex plugin
        run: |
          cargo test --locked -p clumsiesd --lib credentials::windows:: -- --nocapture
          cargo test --locked -p clumsiesd --lib ipc::platform::tests::pipe_is_exclusive_local_and_transfers_bounded_frames -- --exact --nocapture
          cargo test --locked -p clumsiesd --lib agent_adapter::codex_plugin::
      - name: Test Windows database paths and memory retrieval
        run: |
          cargo test --locked -p clumsiesd --lib sqlite_file_paths_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p clumsiesd --lib search::tests::commit_activate_load_and_draft_delta_form_one_effective_memory_loop -- --exact
      - name: Test desktop
        run: cargo test --locked -p desktop
      - name: Build bundled client and daemon
        run: cargo build --locked --release -p desktop -p clumsiesd
      - name: Exercise packaged startup and IPC
        shell: pwsh
        run: |
          $client = (Resolve-Path target/release/clumsies-desktop.exe).Path
          $image = [System.IO.File]::ReadAllBytes($client)
          $pe = [BitConverter]::ToInt32($image, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($image, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "The desktop executable must use the Windows GUI subsystem" }
          $env:CLUMSIES_DAEMON_ROOT = Join-Path $env:RUNNER_TEMP "clumsies-smoke"
          try {
            foreach ($scenario in @('Packaged startup', 'Existing daemon reuse')) {
              $process = Start-Process $client -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
              # Wait only for the client: the daemon deliberately stays alive.
              if (-not $process.WaitForExit(30000)) {
                $process.Kill()
                throw "$scenario timed out"
              }
              if ($process.ExitCode -ne 0) { throw "$scenario failed: $($process.ExitCode)" }
            }
          } finally {
            Get-Process clumsiesd -ErrorAction SilentlyContinue | Stop-Process
          }
      - name: Assemble the package
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/macos/project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          pwsh -File apps/desktop/packaging/assemble-windows.ps1 $version target/release dist

      - name: Exercise installer, reinstall and uninstall
        shell: pwsh
        run: pwsh -File apps/desktop/packaging/test-windows-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: clumsies-windows-x86_64
          path: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*.sha256
            target/release/clumsies-desktop.exe
            target/release/clumsiesd.exe
          if-no-files-found: error
