name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      distribution:
        description: Preview DMG, notarized app, or initialize missing update feeds
        type: choice
        options: [preview, notarized, update-feeds]
        default: preview
        required: true
      ref:
        description: Source ref (preview must match selected workflow ref; notarized must be main tip)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  update-feeds:
    if: github.event_name == 'workflow_dispatch' && inputs.distribution == 'update-feeds'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize and verify update feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: sh apps/macos/Scripts/ensure-update-feeds.sh

  macos-adhoc:
    if: github.event_name == 'push' || inputs.distribution == 'preview'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify source and tagged version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --depth=1 --no-tags origin "$DEFAULT_BRANCH"
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
            VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
            test "$GITHUB_REF_NAME" = "v$VERSION"
            test -s "docs/releases/$GITHUB_REF_NAME.md"
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and verify ad-hoc DMG
        env:
          CLUMSIES_BUILD_NUMBER: ${{ github.run_number }}
          CLUMSIES_AGENT_RUNTIME_BUILD_ID: adhoc-${{ github.sha }}
          DISTRIBUTION: ${{ github.event_name == 'push' && 'release' || 'preview' }}
        run: sh apps/macos/Scripts/archive-adhoc.sh "$DISTRIBUTION"

      - name: Exercise bundled daemon over XPC and MCP
        env:
          CLUMSIES_TEST_PACKAGED_DAEMON: ${{ github.workspace }}/build/macos-adhoc-derived/Build/Products/Debug/Clumsies.app/Contents/Resources/clumsiesd
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --locked -p clumsiesd --test agent_runtime_xpc_e2e -- --nocapture

      - name: Sign the in-app update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLUMSIES_MACOS_DERIVED_DATA: ${{ github.workspace }}/build/macos-adhoc-derived
          CLUMSIES_MACOS_OUTPUT_DIR: ${{ github.workspace }}/dist/macos
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::SPARKLE_PRIVATE_KEY is required for a tagged release."
              exit 1
            fi
            echo "::warning::SPARKLE_PRIVATE_KEY is not configured. Publishing the DMG without changing the in-app update feed."
            exit 0
          fi
          NATIVE_VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sh apps/macos/Scripts/generate-appcast.sh "$GITHUB_REF_NAME" \
              "dist/macos/Clumsies-$NATIVE_VERSION-macos-arm64.dmg"
          else
            sh apps/macos/Scripts/generate-appcast.sh "macos-preview-$GITHUB_RUN_NUMBER" \
              "dist/macos/Clumsies-$NATIVE_VERSION-preview.$GITHUB_RUN_NUMBER-macos-arm64.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: clumsies-macos-adhoc
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
            dist/macos/*appcast.xml
          if-no-files-found: error

  desktop-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CLUMSIES_AGENT_RUNTIME_BUILD_ID: desktop-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tagged version and the client's own
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test "$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)" = "$VERSION" \
            || { echo "apps/macos/project.yml does not carry $VERSION"; exit 1; }
          test "$(awk -F'"' '/^version = / { print $2; exit }' apps/desktop/Cargo.toml)" = "$VERSION" \
            || { echo "the desktop client does not report $VERSION; bump apps/desktop/Cargo.toml with the release"; exit 1; }

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev libasound2-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Build the client and its engine
        run: cargo build --locked --release -p desktop -p clumsiesd

      - name: Exercise packaged startup and IPC
        env:
          CLUMSIES_DAEMON_ROOT: ${{ runner.temp }}/clumsies-smoke
        run: |
          ./target/release/clumsies-desktop --smoke-test
          ./target/release/clumsies-desktop --smoke-test
          pkill -f 'target/release/clumsiesd' || true

      - name: Assemble the package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PACKAGE="Clumsies-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PACKAGE}/icons"
          # A downloaded program does not need symbols: they are a third of the
          # two binaries and belong to a local build.
          strip --strip-all target/release/clumsies-desktop target/release/clumsiesd
          install -m 755 target/release/clumsies-desktop target/release/clumsiesd "dist/${PACKAGE}/"
          install -m 755 apps/desktop/packaging/install.sh "dist/${PACKAGE}/install.sh"
          install -m 644 apps/desktop/packaging/clumsies.desktop "dist/${PACKAGE}/clumsies.desktop"
          install -m 644 apps/desktop/packaging/README.txt "dist/${PACKAGE}/README.txt"
          cp apps/desktop/assets/icons/clumsies-*.png "dist/${PACKAGE}/icons/"
          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"
          cd dist
          sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          tar -tzf "${PACKAGE}.tar.gz" | sort

      - uses: actions/upload-artifact@v4
        with:
          name: clumsies-desktop-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  desktop-windows:
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CLUMSIES_AGENT_RUNTIME_BUILD_ID: desktop-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Build the client and its engine
        run: cargo build --locked --release -p desktop -p clumsiesd

      - name: Exercise packaged startup and IPC
        shell: pwsh
        run: |
          $env:CLUMSIES_DAEMON_ROOT = Join-Path $env:RUNNER_TEMP "clumsies-smoke"
          try {
            & target/release/clumsies-desktop.exe --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "Packaged startup failed" }
            & target/release/clumsies-desktop.exe --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "Existing daemon reuse failed" }
          } finally {
            Get-Process clumsiesd -ErrorAction SilentlyContinue | Stop-Process
          }

      - name: Assemble the package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $package = "Clumsies-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$package/icons" | Out-Null
          Copy-Item target/release/clumsies-desktop.exe, target/release/clumsiesd.exe "dist/$package/"
          Copy-Item apps/desktop/packaging/README.txt "dist/$package/README.txt"
          Copy-Item apps/desktop/assets/icons/clumsies-256.png "dist/$package/icons/"
          Copy-Item apps/desktop/assets/icons/clumsies.ico "dist/$package/icons/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Out-File -Encoding ascii "dist/$package.zip.sha256"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: clumsies-desktop-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: [macos-adhoc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clumsies-macos-adhoc
          path: dist/macos

      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="macos-preview-$GITHUB_RUN_NUMBER"
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF
          ## Install

          Download the DMG below, open it, and drag Clumsies.app into Applications.
          macOS 14 or later on Apple Silicon (M1 or newer). No build tools required.

          The App connects to https://app.clumsies.ai by default. Signing in requires
          access to an organization.

          This preview is ad-hoc signed and **not notarized by Apple**. After first trying
          to open it, use System Settings → Privacy & Security → Open Anyway only if you
          trust this download. Managed Macs may restrict this exception.

          Updates: use Settings → General → Check for Updates. Update appears beside your account when a new update is available.
          Signed updates download and install inside the App; choose Install and Relaunch when ready.
          Only releases with a signed preview-appcast.xml are offered as in-app updates.
          Other releases remain available for manual DMG installation.
          Existing installations using the old update feed need this DMG installed once.
          Accounts, Memory, and settings remain in your user data directory.

          Source: $GITHUB_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Configuration: Debug, regular Clumsies app identity; includes the bundled daemon.
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Clumsies macOS Preview $GITHUB_RUN_NUMBER" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          gh release upload "$TAG" dist/macos/* --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false

          sh apps/macos/Scripts/ensure-update-feeds.sh
          if [ -f dist/macos/preview-appcast.xml ]; then
            gh release upload macos-updates dist/macos/preview-appcast.xml --clobber
          fi

  macos-release:
    if: github.event_name == 'workflow_dispatch' && inputs.distribution == 'notarized'
    environment: macos-signing
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify release source is the default branch tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 --no-tags origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "Release source must be the current default branch tip." >&2
            exit 1
          }
          test -x apps/macos/Scripts/verify-release-signature.sh || {
            echo "Release source is missing the signed release gate." >&2
            exit 1
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Validate release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            KEYCHAIN_PASSWORD
          do
            test -n "${!name}" || { echo "Missing release secret: $name"; exit 1; }
          done

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(printf '%s' "$CERT_INFO" | awk -F'"' '{print $2}')
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build and notarize native macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLUMSIES_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          CLUMSIES_VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          export CLUMSIES_VERSION
          apps/macos/Scripts/archive-release.sh

      - name: Stage signed macOS candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: clumsies-macos
          path: |
            dist/macos/Clumsies-*-macos-universal.dmg
            dist/macos/Clumsies-*-macos-universal.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push'
    needs: [macos-adhoc, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download native macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: clumsies-macos-adhoc
          path: dist/macos

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: clumsies-desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$NOTES"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --notes-file "$NOTES" \
              --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/macos/* dist/desktop/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest --notes-file "$NOTES"

          sh apps/macos/Scripts/ensure-update-feeds.sh
          gh release upload macos-updates dist/macos/appcast.xml --clobber
          # Preview installations receive this release, then use its stable feed.
          cp dist/macos/appcast.xml dist/macos/preview-appcast.xml
          gh release upload macos-updates dist/macos/preview-appcast.xml --clobber
