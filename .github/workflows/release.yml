name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      distribution:
        description: Preview DMG needs no Apple credentials; notarized builds require Developer ID
        type: choice
        options: [preview, notarized]
        default: preview
        required: true
      ref:
        description: Source ref (preview must match selected workflow ref; notarized must be main tip)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  macos-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.distribution == 'preview'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify preview source matches the selected workflow
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and verify preview DMG
        env:
          CLUMSIES_BUILD_NUMBER: ${{ github.run_number }}
          CLUMSIES_AGENT_RUNTIME_BUILD_ID: preview-${{ github.sha }}
        run: sh apps/macos/Scripts/archive-preview.sh

      - name: Exercise bundled daemon over XPC and MCP
        env:
          CLUMSIES_TEST_PACKAGED_DAEMON: ${{ github.workspace }}/build/macos-preview-derived/Build/Products/Debug/Clumsies.app/Contents/Resources/clumsiesd
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --locked -p daemon --test agent_runtime_xpc_e2e -- --nocapture

      - name: Sign the Preview in-app update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLUMSIES_MACOS_DERIVED_DATA: ${{ github.workspace }}/build/macos-preview-derived
          CLUMSIES_MACOS_OUTPUT_DIR: ${{ github.workspace }}/dist/macos-preview
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not configured. Publishing the DMG without changing the in-app update feed."
            exit 0
          fi
          NATIVE_VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          sh apps/macos/Scripts/generate-appcast.sh "macos-preview-$GITHUB_RUN_NUMBER" \
            "dist/macos-preview/Clumsies-$NATIVE_VERSION-preview.$GITHUB_RUN_NUMBER-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: clumsies-macos-preview
          path: |
            dist/macos-preview/*.dmg
            dist/macos-preview/*.sha256
            dist/macos-preview/preview-appcast.xml
          if-no-files-found: error

  publish-preview:
    needs: [macos-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clumsies-macos-preview
          path: dist/macos-preview

      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="macos-preview-$GITHUB_RUN_NUMBER"
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF
          ## Install

          Download the DMG below, open it, and drag Clumsies.app into Applications.
          macOS 14 or later on Apple Silicon (M1 or newer). No build tools required.

          The App connects to https://app.clumsies.ai by default. Signing in requires
          access to an organization.

          This preview is ad-hoc signed and **not notarized by Apple**. After first trying
          to open it, use System Settings → Privacy & Security → Open Anyway only if you
          trust this download. Managed Macs may restrict this exception.

          Updates: use Update beside your account in the sidebar, or Settings → General → Check for Updates.
          Signed updates download and install inside the App; choose Install and Relaunch when ready.
          Only releases with a signed preview-appcast.xml are offered as in-app updates.
          Other releases remain available for manual DMG installation.
          Existing installations using the old update feed need this DMG installed once.
          Accounts, Memory, and settings remain in your user data directory.

          Source: $GITHUB_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Configuration: Debug, regular Clumsies app identity; includes the bundled daemon.
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Clumsies macOS Preview $GITHUB_RUN_NUMBER" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          gh release upload "$TAG" dist/macos-preview/* --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false

          if [ -f dist/macos-preview/preview-appcast.xml ]; then
            gh release view macos-updates >/dev/null 2>&1 || \
              gh release create macos-updates --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "macOS update feeds" --notes "Stable URLs for Sparkle update feeds. Download installers from the versioned releases."
            gh release upload macos-updates dist/macos-preview/preview-appcast.xml --clobber
          fi

  macos-release:
    if: github.event_name == 'push' || inputs.distribution == 'notarized'
    environment: macos-signing
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify release source is the default branch tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 --no-tags origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "Release source must be the current default branch tip." >&2
            exit 1
          }
          test -x apps/macos/Scripts/verify-release-signature.sh || {
            echo "Release source is missing the signed release gate." >&2
            exit 1
          }

      - name: Verify tag matches native macOS version
        if: github.event_name == 'push'
        run: |
          NATIVE_VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          test "$GITHUB_REF_NAME" = "v$NATIVE_VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Validate release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            KEYCHAIN_PASSWORD
          do
            test -n "${!name}" || { echo "Missing release secret: $name"; exit 1; }
          done

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(printf '%s' "$CERT_INFO" | awk -F'"' '{print $2}')
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build and notarize native macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLUMSIES_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            CLUMSIES_VERSION="${GITHUB_REF_NAME#v}"
          else
            CLUMSIES_VERSION=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          fi
          export CLUMSIES_VERSION
          apps/macos/Scripts/archive-release.sh

      - name: Generate Sparkle appcast
        if: github.event_name == 'push'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: apps/macos/Scripts/generate-appcast.sh "$GITHUB_REF_NAME" "dist/macos/Clumsies-${GITHUB_REF_NAME#v}-macos-universal.zip"

      - name: Stage tagged macOS artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: clumsies-macos
          path: |
            dist/macos/Clumsies-*-macos-universal.dmg
            dist/macos/Clumsies-*-macos-universal.zip
            dist/macos/appcast.xml
          if-no-files-found: error

      - name: Stage signed macOS candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: clumsies-macos
          path: |
            dist/macos/Clumsies-*-macos-universal.dmg
            dist/macos/Clumsies-*-macos-universal.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push'
    needs: [macos-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: clumsies-macos
          path: dist/macos

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/macos/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

          gh release view macos-updates >/dev/null 2>&1 || \
            gh release create macos-updates --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "macOS update feeds" --notes "Stable URLs for Sparkle update feeds. Download installers from the versioned releases."
          gh release upload macos-updates dist/macos/appcast.xml --clobber
