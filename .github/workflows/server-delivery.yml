name: Server Delivery

on:
  workflow_call:
    secrets:
      DEPLOY_HOST:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_USER:
        required: false
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image reference for a retry or rollback
        required: true
        type: string
      commit:
        description: Full 40-character commit represented by the image
        required: true
        type: string

concurrency:
  group: production-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/lilhammerfun/clumsies-server

jobs:
  current:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.target.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject superseded Server changes
        id: target
        run: python3 dev/ci_impact.py current --component server_delivery

  publish:
    needs: current
    if: >-
      needs.current.outputs.current == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      context: .
      file: ./crates/server/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: server
      cache-mode: max
      meta-images: ghcr.io/lilhammerfun/clumsies-server
      meta-tags: |
        type=raw,value=main
        type=raw,value=sha-${{ github.sha }}
      labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.licenses=MIT
      sign: "true"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  resolve:
    needs: publish
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        needs.publish.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.target.outputs.image }}
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - name: Resolve immutable delivery target
        id: target
        env:
          AUTOMATIC_COMMIT: ${{ github.sha }}
          AUTOMATIC_DIGEST: ${{ needs.publish.outputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_COMMIT: ${{ inputs.commit }}
          MANUAL_IMAGE: ${{ inputs.image }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            image="$MANUAL_IMAGE"
            commit="$MANUAL_COMMIT"
          else
            image="$IMAGE_NAME@$AUTOMATIC_DIGEST"
            commit="$AUTOMATIC_COMMIT"
          fi

          [[ "$image" =~ ^ghcr\.io/lilhammerfun/clumsies-server@sha256:[a-f0-9]{64}$ ]]
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.SERVER_AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SERVER_PUBLIC_URL }}
    steps:
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.commit }}
          TARGET_IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/deploy_key"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $TARGET_IMAGE $TARGET_COMMIT"

  report:
    needs: resolve
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      github.event_name != 'workflow_dispatch' &&
      vars.SERVER_AUTO_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report publish-only bootstrap
        env:
          TARGET_COMMIT: ${{ needs.resolve.outputs.commit }}
          TARGET_IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          echo "Image published; production deployment is disabled by SERVER_AUTO_DEPLOY_ENABLED."
          echo "Target: $TARGET_IMAGE ($TARGET_COMMIT)"
