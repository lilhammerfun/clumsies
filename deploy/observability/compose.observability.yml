name: clumsies-observability

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability, clumsies]

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [observability]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *logging
    environment:
      # Both values apply to the first start only; see the README for changing
      # the administrator later.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    logging: *logging
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/clumsies-observability/textfile:/textfile:ro
    networks: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    logging: *logging
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    logging: *logging
    environment:
      DATA_SOURCE_NAME: ${CLUMSIES_POSTGRES_DSN:?set CLUMSIES_POSTGRES_DSN}
    networks: [observability, clumsies]

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
    networks: [observability, clumsies]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    logging: *logging
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [observability]

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    logging: *logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [observability]

networks:
  observability:
  clumsies:
    external: true
    name: clumsies_clumsies

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
