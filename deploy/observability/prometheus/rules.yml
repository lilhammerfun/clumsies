groups:
  - name: collection
    rules:
      # Derived from targets.json and probes.json; test-delivery.py detects drift.
      - record: clumsies_observability_expected_target
        expr: >-
          label_replace(label_replace(vector(1), "job", "prometheus", "__name__", ".*"), "instance", "localhost:9090", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "node", "__name__", ".*"), "instance", "node-exporter:9100", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "cadvisor", "__name__", ".*"), "instance", "cadvisor:8080", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "postgres", "__name__", ".*"), "instance", "postgres-exporter:9187", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "caddy", "__name__", ".*"), "instance", "caddy:2019", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "alloy", "__name__", ".*"), "instance", "alloy:12345", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "loki", "__name__", ".*"), "instance", "loki:3100", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "server", "__name__", ".*"), "instance", "server:8080", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "alertmanager", "__name__", ".*"), "instance", "alertmanager:9093", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "blackbox-public", "__name__", ".*"), "instance", "https://app.clumsies.ai/api/v1/admin/health", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "blackbox-public", "__name__", ".*"), "instance", "https://docs.clumsies.ai/", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "blackbox-public", "__name__", ".*"), "instance", "https://clumsies.ai/", "__name__", ".*")
          or label_replace(label_replace(vector(1), "job", "blackbox-public", "__name__", ".*"), "instance", "https://www.clumsies.ai/", "__name__", ".*")
      - record: clumsies_observability_target_health
        expr: >-
          (up and on (job, instance) clumsies_observability_expected_target)
          or on (job, instance)
          ((clumsies_observability_expected_target unless on (job, instance) up) * -1)
      - alert: ExpectedScrapeTargetMissing
        expr: clumsies_observability_expected_target unless on (job, instance) up
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Expected target {{ $labels.job }} ({{ $labels.instance }}) is missing from discovery"
          description: "Check Prometheus file discovery and the deployed targets.json/probes.json catalogs."

      - alert: OperationalMetricsCollectionStale
        expr: >-
          (up{job="node"} == 1) unless on (job, instance)
          ((time() - clumsies_observability_collection_timestamp_seconds >= 0) and on (job, instance)
          (time() - clumsies_observability_collection_timestamp_seconds <= 15 * 60))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clumsies operational metrics are missing, stale, or have invalid time"
          description: "Check the textfile collector service and timer; backup and restore status may be out of date."

      # Retain historical receipts, but do not trust their age after a clock rollback.
      # Name each source explicitly so simultaneous invalid metrics cannot collapse labels.
      - alert: OperationalTimestampInvalid
        expr: >-
          label_replace(
          {__name__=~"clumsies_(observability_collection|database_collection|backup_last_success|restore_drill_last_success|release_last_success|unit_last_exit)_timestamp_seconds"} > time(),
          "timestamp_metric", "$1", "__name__", "(.*)")
          and on (job, instance) (up{job="node"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clumsies {{ $labels.timestamp_metric }} is in the future"
          description: "Check the host clock and source receipt. Keep historical values, but do not treat a negative age as current or fresh."

      - alert: AlertmanagerNotificationFailed
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total{job="alertmanager"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager notification delivery failed for {{ $labels.integration }}"
          description: "Check Alertmanager logs and notification provider access. This failure is visible in Grafana; the same broken notification channel may not deliver this alert."

  - name: availability
    rules:
      - alert: PublicEndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Public endpoint probe for {{ $labels.instance }} is failing"
          description: "The public probe has failed for 2 minutes. Check HTTPS reachability and endpoint readiness; the App health probe requires HTTP 200 and JSON status=ok."

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days"

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) is down"

  - name: capacity
    rules:
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory below 10% on {{ $labels.instance }}"

  - name: application
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not reachable by the exporter"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage above 80%"

      - alert: ContainerMemoryHigh
        expr: sum by (name) (container_memory_working_set_bytes{name=~"clumsies-.*"}) / 1024 / 1024 / 1024 > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} uses more than 2 GiB"

      # Keep the existing 1% objective, but evaluate each site independently.
      # subroute measures the site handler once instead of summing middleware.
      - alert: HttpServerErrorRate
        expr: >-
          sum by (host) (rate(caddy_http_request_duration_seconds_count{job="caddy",handler="subroute",host=~"app\\.clumsies\\.ai|docs\\.clumsies\\.ai|clumsies\\.ai|www\\.clumsies\\.ai",code=~"5.."}[5m]))
          / sum by (host) (rate(caddy_http_request_duration_seconds_count{job="caddy",handler="subroute",host=~"app\\.clumsies\\.ai|docs\\.clumsies\\.ai|clumsies\\.ai|www\\.clumsies\\.ai"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 1 percent of requests to {{ $labels.host }} answer with a server error"

      - alert: LogDeliveryRetries
        expr: sum(rate(loki_write_batch_retries_total{job="alloy"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Log delivery to Loki has been retrying for 5 minutes"

      - alert: LogEntriesDropped
        expr: sum(increase(loki_write_dropped_entries_total{job="alloy"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Log entries were dropped; request history may be incomplete"

  - name: operations
    rules:
      - alert: BackupStale
        expr: >-
          (up{job="node"} == 1) unless on (job, instance)
          ((time() - clumsies_backup_last_success_timestamp_seconds >= 0) and on (job, instance)
          (time() - clumsies_backup_last_success_timestamp_seconds <= 26 * 3600))
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup success timestamp is missing, in the future, or older than 26 hours"

      - alert: RestoreDrillStale
        expr: >-
          (up{job="node"} == 1) unless on (job, instance)
          ((time() - clumsies_restore_drill_last_success_timestamp_seconds >= 0) and on (job, instance)
          (time() - clumsies_restore_drill_last_success_timestamp_seconds <= 8 * 24 * 3600))
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Restore-drill success timestamp is missing, in the future, or older than 8 days"

      - alert: BackupUnitFailed
        expr: >-
          (clumsies_unit_last_exit_ok{unit="clumsies-backup.service"} == 0) and on (job, instance)
          ((time() - clumsies_observability_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_observability_collection_timestamp_seconds <= 15 * 60))
          unless on (job, instance, unit) (clumsies_unit_last_exit_timestamp_seconds > time())
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "clumsies-backup.service last run failed"

      - alert: RestoreDrillFailed
        expr: >-
          (clumsies_unit_last_exit_ok{unit="clumsies-restore-drill.service"} == 0) and on (job, instance)
          ((time() - clumsies_observability_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_observability_collection_timestamp_seconds <= 15 * 60))
          unless on (job, instance, unit) (clumsies_unit_last_exit_timestamp_seconds > time())
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "clumsies-restore-drill.service last completed run failed"

      - alert: OperationalUnitUnavailable
        expr: >-
          (clumsies_unit_last_exit_state{state="missing"} == 1) and on (job, instance)
          ((time() - clumsies_observability_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_observability_collection_timestamp_seconds <= 15 * 60))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.unit }} status is unavailable"

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alert pipeline watchdog (always firing)"
          description: "Always firing in Prometheus. Receipt at the configured destination confirms end-to-end notification delivery; firing alone does not."

      - alert: DatabaseLongRunningQuery
        expr: >-
          (clumsies_db_longest_query_seconds > 60) and on (job, instance)
          ((clumsies_database_collection_success == 1) and on (job, instance)
          ((time() - clumsies_database_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_database_collection_timestamp_seconds <= 15 * 60)))
          and on (job, instance)
          ((time() - clumsies_observability_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_observability_collection_timestamp_seconds <= 15 * 60))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A PostgreSQL query has been running for more than a minute"

      - alert: DatabaseMetricsCollectionFailed
        expr: >-
          (up{job="node"} == 1) unless on (job, instance)
          ((clumsies_database_collection_success == 1)
          and on (job, instance) (time() - clumsies_database_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_database_collection_timestamp_seconds <= 15 * 60)
          and on (job, instance) (time() - clumsies_observability_collection_timestamp_seconds >= 0)
          and on (job, instance) (time() - clumsies_observability_collection_timestamp_seconds <= 15 * 60))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clumsies database metrics are missing, failed, stale, or have invalid time"
          description: "Node exporter is reachable but the database snapshot is unhealthy. Check clumsies-observability-metrics.service and its timer, Compose access, and PostgreSQL."
