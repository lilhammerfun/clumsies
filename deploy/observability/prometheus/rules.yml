groups:
  - name: availability
    rules:
      - alert: PublicEndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not answering"
          description: "Blackbox probe has failed for 2 minutes."

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days"

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) is down"

  - name: capacity
    rules:
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory below 10% on {{ $labels.instance }}"

  - name: application
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not reachable by the exporter"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage above 80%"

      - alert: ContainerMemoryHigh
        expr: sum by (name) (container_memory_working_set_bytes{name=~"clumsies-.*"}) / 1024 / 1024 / 1024 > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} uses more than 2 GiB"

      # Threshold follows the one percent error-rate objective rather than a
      # locally chosen number.
      - alert: HttpServerErrorRate
        expr: >-
          sum(rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m]))
          / clamp_min(sum(rate(caddy_http_request_duration_seconds_count[5m])), 0.01) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 1 percent of edge requests answer with a server error"

  - name: operations
    rules:
      - alert: BackupStale
        expr: time() - clumsies_backup_last_success_timestamp_seconds > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful PostgreSQL backup in the last 26 hours"

      - alert: RestoreDrillStale
        expr: time() - clumsies_restore_drill_last_success_timestamp_seconds > 8 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No successful restore drill in the last 8 days"

      - alert: BackupUnitFailed
        expr: clumsies_unit_last_exit_ok{unit="clumsies-backup.service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "clumsies-backup.service last run failed"

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alert pipeline watchdog (always firing)"
          description: "This alert confirms Prometheus to Alertmanager to email delivery works."

  # Queueing, saturation, and business throughput. These are the signals that
  # stay green while the product silently stops doing useful work.
  - name: business
    rules:
      - alert: ClientActivityWithoutCommits
        expr: >-
          sum(increase(caddy_http_request_duration_seconds_count{code=~"2.."}[6h])) > 200
          and increase(clumsies_commits_total[6h]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Clients reach the Server but nothing was committed for six hours"

      - alert: OpenDraftBacklogGrowing
        expr: deriv(clumsies_drafts{status="open"}[6h]) > 0.5
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Open drafts keep growing by more than half a draft per hour"

      - alert: OpenDraftBacklogAging
        expr: clumsies_oldest_open_draft_age_seconds > 30 * 24 * 3600
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The oldest open draft is more than 30 days old"

      - alert: ReconciliationConflictsBacklog
        expr: clumsies_reconciliation_candidates{status="conflicts"} > 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "More than 20 drafts wait on unresolved reconciliation conflicts"

      - alert: UnreadNotificationBacklog
        expr: clumsies_inbox_unread > 100
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "More than 100 unread inbox notifications"

      - alert: DatabaseLongRunningQuery
        expr: clumsies_db_longest_query_seconds > 60
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A PostgreSQL query has been running for more than a minute"
