groups:
  - name: availability
    rules:
      - alert: PublicEndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not answering"
          description: "Blackbox probe has failed for 2 minutes."

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days"

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) is down"

  - name: capacity
    rules:
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory below 10% on {{ $labels.instance }}"

  - name: application
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not reachable by the exporter"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage above 80%"

      - alert: ContainerMemoryHigh
        expr: sum by (name) (container_memory_working_set_bytes{name=~"clumsies-.*"}) / 1024 / 1024 / 1024 > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} uses more than 2 GiB"

      # Keep the existing 1% objective, but evaluate each site independently.
      # subroute measures the site handler once instead of summing middleware.
      - alert: HttpServerErrorRate
        expr: >-
          sum by (host) (rate(caddy_http_request_duration_seconds_count{job="caddy",handler="subroute",host=~"app\\.clumsies\\.ai|docs\\.clumsies\\.ai|clumsies\\.ai|www\\.clumsies\\.ai",code=~"5.."}[5m]))
          / sum by (host) (rate(caddy_http_request_duration_seconds_count{job="caddy",handler="subroute",host=~"app\\.clumsies\\.ai|docs\\.clumsies\\.ai|clumsies\\.ai|www\\.clumsies\\.ai"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 1 percent of requests to {{ $labels.host }} answer with a server error"

      - alert: LogDeliveryRetries
        expr: sum(rate(loki_write_batch_retries_total{job="alloy"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Log delivery to Loki has been retrying for 5 minutes"

      - alert: LogEntriesDropped
        expr: sum(increase(loki_write_dropped_entries_total{job="alloy"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Log entries were dropped; request history may be incomplete"

  - name: operations
    rules:
      - alert: BackupStale
        expr: time() - clumsies_backup_last_success_timestamp_seconds > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful PostgreSQL backup in the last 26 hours"

      - alert: RestoreDrillStale
        expr: time() - clumsies_restore_drill_last_success_timestamp_seconds > 8 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No successful restore drill in the last 8 days"

      - alert: BackupUnitFailed
        expr: clumsies_unit_last_exit_ok{unit="clumsies-backup.service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "clumsies-backup.service last run failed"

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alert pipeline watchdog (always firing)"
          description: "This alert confirms Prometheus to Alertmanager to email delivery works."

      - alert: DatabaseLongRunningQuery
        expr: clumsies_db_longest_query_seconds > 60
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A PostgreSQL query has been running for more than a minute"

      - alert: DatabaseMetricsCollectionFailed
        expr: >-
          (up{job="node"} == 1) unless on (job, instance)
          ((clumsies_database_collection_success == 1) and on (job, instance)
          (time() - clumsies_database_collection_timestamp_seconds <= 15 * 60))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clumsies database metrics are missing, failed, or stale"
          description: "Node exporter is reachable but the database snapshot is unhealthy. Check clumsies-observability-metrics.service and its timer, Compose access, and PostgreSQL."
