[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "clumsies-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
cookie = "0.18.1"
diffy = "0.5.0"
hex = "0.4.3"
openidconnect = "4.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "macros", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
chrono = "0.4.45"
rand = "0.8.6"
rsa = { version = "0.9.10", features = ["pem"] }
serde_yaml_ng = "0.10.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.52.3", features = ["test-util"] }
wiremock = "0.6.5"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
