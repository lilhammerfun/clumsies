openapi: 3.1.0
info:
  title: clumsies Admin API
  version: 1.0.0
  summary: Server API for organization administration and project configuration.
  description: >-
    Organization-wide operations require an organization owner or admin.
    Project detail and member reads also allow that project's members; project
    mutations and member candidate searches allow that project's admins.
servers:
  - url: https://server.clumsies.local
security:
  - bearerAuth: []
paths:
  /api/v1/setup:
    get:
      operationId: getSetup
      summary: Read the one-time Server setup state.
      security: []
      responses:
        "200":
          description: Current setup state and any active setup session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/sessions:
    post:
      operationId: createSetupSession
      summary: Exchange the deployment Setup Code for a short setup session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupSessionRequest"
      responses:
        "201":
          description: Setup session created. The session credential is returned as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSetupSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/configuration:
    put:
      operationId: replaceSetupConfiguration
      summary: Replace the organization and default project configuration for this setup session.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSetupConfigurationRequest"
      responses:
        "200":
          description: Saved setup configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupConfiguration"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/oidc-authorizations:
    post:
      operationId: createSetupOidcAuthorization
      summary: Create the OIDC authorization used to bind the first Owner.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupOidcAuthorizationRequest"
      responses:
        "201":
          description: OIDC authorization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOidcAuthorization"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/identity-provider:
    get:
      operationId: getAdminIdentityProvider
      summary: Read the safe enterprise identity provider configuration.
      responses:
        "200":
          description: OIDC Provider state without credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/org:
    get:
      operationId: getAdminOrg
      summary: Read organization settings.
      responses:
        "200":
          description: Organization settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrg"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAdminOrg
      summary: Update organization settings.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminOrgRequest"
      responses:
        "200":
          description: Updated organization settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrg"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/members:
    get:
      operationId: listAdminMembers
      summary: List organization members.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: >-
            Case-insensitive literal substring search of member email and display name.
            Surrounding whitespace is ignored; empty input returns all records.
            Pagination applies to matching records; keep q unchanged while using a cursor.
          schema:
            type: string
      responses:
        "200":
          description: Member page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAdminMember
      summary: Create an organization member admission record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Created member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateAdminMember
      summary: Update organization member role or status.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdminMember
      summary: Remove or disable an organization member.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects:
    get:
      operationId: listAdminProjects
      summary: List project metadata for administration.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project metadata page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAdminProject
      summary: Create a project and grant the current administrator project admin access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProject"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getAdminProject
      summary: Read project metadata for administration.
      description: Requires project membership or an organization owner/admin.
      responses:
        "200":
          description: Project metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProject"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAdminProject
      summary: Update project metadata.
      description: Requires this project's admin or an organization owner/admin.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProject"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdminProject
      summary: Delete a project and its governed content.
      description: Requires this project's admin or an organization owner/admin.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects/{project_id}/member-candidates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMemberCandidates
      summary: Find existing organization users who can be added to this project.
      description: Requires this project's admin or an organization owner/admin. Excludes disabled users and existing members.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive substring match against email and display name.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Eligible user profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberCandidateListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAdminProjectMembers
      summary: List project members.
      description: Requires project membership or an organization owner/admin.
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/ProjectRole"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project member page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAdminProjectMember
      summary: Add an organization member to a project.
      description: Requires this project's admin or an organization owner/admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectMemberRequest"
      responses:
        "201":
          description: Created project membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects/{project_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateAdminProjectMember
      summary: Update a project member role.
      description: Requires this project's admin or an organization owner/admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated project membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdminProjectMember
      summary: Remove a member from a project.
      description: Requires this project's admin or an organization owner/admin.
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tokens:
    get:
      operationId: listAdminTokens
      summary: List access token metadata.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Access token metadata page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteAdminToken
      summary: Revoke an access token.
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/audit-events:
    get:
      operationId: listAdminAuditEvents
      summary: Query security audit events.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: >-
            Case-insensitive literal substring search of action, actor name or email, and current target name.
            Surrounding whitespace is ignored; empty input returns all records.
            Pagination applies to matching records; keep q unchanged while using a cursor.
          schema:
            type: string
      responses:
        "200":
          description: Audit event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/memory-export:
    get:
      operationId: exportOrgMemoryState
      summary: >-
        Export the org's effective Memory state (memories including issues/,
        drafts, org selections, bundles) with IDs verbatim as the identity map
        for the unified Memory migration.
      responses:
        "200":
          description: Neutral, verifiable Memory state export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryExport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/health:
    get:
      operationId: getAdminHealth
      summary: Read backend health.
      security: []
      responses:
        "200":
          description: Backend health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    setupSession:
      type: apiKey
      in: cookie
      name: __Host-clumsies_setup_session
      description: >-
        HttpOnly one-time setup session cookie. Local plain-HTTP development
        uses the unprefixed clumsies_setup_session name because __Host-
        cookies require HTTPS.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    InstallationState:
      type: string
      enum: [setup_required, initialized]
    SetupConfiguration:
      type: object
      required: [org_name, default_project_name, allowed_email_domains]
      properties:
        org_name:
          type: string
          minLength: 1
          maxLength: 120
        default_project_name:
          type: string
          minLength: 1
          maxLength: 120
        allowed_email_domains:
          type: array
          uniqueItems: true
          items:
            type: string
    SetupSessionStatus:
      type: object
      required: [expires_at, configuration]
      properties:
        expires_at:
          type: string
          format: date-time
        configuration:
          oneOf:
            - $ref: "#/components/schemas/SetupConfiguration"
            - type: "null"
    SetupStatus:
      type: object
      required: [state, setup_code_configured, oidc_configured, session]
      properties:
        state:
          $ref: "#/components/schemas/InstallationState"
        setup_code_configured:
          type: boolean
        oidc_configured:
          type: boolean
        session:
          oneOf:
            - $ref: "#/components/schemas/SetupSessionStatus"
            - type: "null"
    CreateSetupSessionRequest:
      type: object
      required: [setup_code]
      properties:
        setup_code:
          type: string
          minLength: 1
    CreateSetupSessionResponse:
      type: object
      required: [expires_at, csrf_token]
      properties:
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    ReplaceSetupConfigurationRequest:
      allOf:
        - $ref: "#/components/schemas/SetupConfiguration"
    SetupOidcAuthorizationRequest:
      type: object
      required: [redirect_uri, state, code_challenge, code_challenge_method]
      properties:
        redirect_uri:
          type: string
          format: uri
        state:
          type: string
          minLength: 1
        code_challenge:
          type: string
          minLength: 43
          maxLength: 43
        code_challenge_method:
          type: string
          enum: [S256]
    SetupOidcAuthorization:
      type: object
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
    OidcProviderStatus:
      type: object
      required: [protocol, configured, issuer, callback_url, admission_mode, secret_source]
      properties:
        protocol:
          type: string
          enum: [oidc]
        configured:
          type: boolean
        issuer:
          type: [string, "null"]
          format: uri
        callback_url:
          type: [string, "null"]
          format: uri
        admission_mode:
          type: string
          enum: [invite_only]
        secret_source:
          type: string
          enum: [deployment_environment]
    AdminOrg:
      type: object
      required: [org_id, name, allowed_email_domains, revision, updated_at]
      properties:
        org_id:
          type: string
        name:
          type: string
        allowed_email_domains:
          type: array
          items:
            type: string
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
    UpdateAdminOrgRequest:
      type: object
      properties:
        name:
          type: string
        allowed_email_domains:
          type: array
          items:
            type: string
    MemberListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    CreateMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/OrgRole"
    UpdateMemberRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
    Member:
      type: object
      required: [user_id, email, display_name, role, status, external_identity_bound, revision]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/OrgRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        external_identity_bound:
          type: boolean
        revision:
          type: integer
    AdminProjectListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminProject"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    AdminProject:
      type: object
      required: [project_id, name, description, member_count, revision, created_at, updated_at]
      properties:
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
    ProjectMemberCandidateListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserRef"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    ProjectMemberListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    CreateProjectMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
    UpdateProjectMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectMember:
      type: object
      required: [project_id, user, role, joined_at]
      properties:
        project_id:
          type: string
        user:
          $ref: "#/components/schemas/UserRef"
        role:
          $ref: "#/components/schemas/ProjectRole"
        joined_at:
          type: string
          format: date-time
    AccessTokenListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenMeta"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    AccessTokenMeta:
      type: object
      required: [token_id, user_id, kind, revoked, expires_at, created_at]
      properties:
        token_id:
          type: string
        user_id:
          type: string
        kind:
          type: string
          enum: [access, refresh, integration, web_session]
        revoked:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    AuditEventListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    AuditEvent:
      type: object
      required: [event_id, actor_user_id, actor_display_name, actor_email, action, target_type, target_id, created_at]
      properties:
        event_id:
          type: string
        actor_user_id:
          type: [string, "null"]
        actor_display_name:
          type: [string, "null"]
        actor_email:
          type: [string, "null"]
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: [string, "null"]
        target_display_name:
          type: [string, "null"]
          description: Current target name, or null when the object no longer exists or has no supported name.
        created_at:
          type: string
          format: date-time
    MemoryExport:
      type: object
      required: [org_id, exported_at, memories, drafts, selections, bundles]
      properties:
        org_id:
          type: string
        exported_at:
          type: string
          format: date-time
        memories:
          type: array
          items:
            $ref: "#/components/schemas/MemoryExportItem"
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/MemoryExportDraft"
        selections:
          type: array
          items:
            $ref: "#/components/schemas/MemoryExportSelection"
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/MemoryExportBundle"
    MemoryExportItem:
      type: object
      required:
        [memory_id, scope, path, name, description, status, content_hash, body, updated_at]
      properties:
        memory_id:
          type: string
          description: >-
            Legacy ctx_/rul_/wfl_ or new mem_ id, emitted verbatim so the export
            doubles as the old_id -> memory_id identity map.
        scope:
          type: string
          enum: [org, project]
        project_id:
          type: [string, "null"]
        path:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, deprecated, archived]
        content_hash:
          type: string
        body:
          type: string
        updated_at:
          type: string
          format: date-time
    MemoryExportDraft:
      type: object
      required: [draft_id, project_id, title, description, resource_scope, status, version, operations]
      properties:
        draft_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        description:
          type: string
        resource_scope:
          type: string
          enum: [org, project]
        target_id:
          type: [string, "null"]
        path:
          type: [string, "null"]
        status:
          type: string
        version:
          type: integer
          format: int64
        operations:
          type: array
          description: Raw draft_operations rows (action, scope, kind, ids, content) as JSON.
          items:
            type: object
    MemoryExportSelection:
      type: object
      required: [project_id, resource_ids, revision]
      properties:
        project_id:
          type: string
        resource_ids:
          type: array
          items:
            type: string
        revision:
          type: integer
          format: int64
    MemoryExportBundle:
      type: object
      required: [bundle_id, owner_user_id, name, description, resource_ids, revision]
      properties:
        bundle_id:
          type: string
        owner_user_id:
          type: string
        name:
          type: string
        description:
          type: string
        resource_ids:
          type: array
          items:
            type: string
        revision:
          type: integer
          format: int64
    AdminHealth:
      type: object
      required: [status, version, database, schema, commit_service, oidc]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        database:
          $ref: "#/components/schemas/HealthCheck"
        schema:
          $ref: "#/components/schemas/HealthCheck"
        commit_service:
          $ref: "#/components/schemas/HealthCheck"
        oidc:
          $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        message:
          type: string
    DeleteResult:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    OrgRole:
      type: string
      enum: [owner, admin, member]
    MemberStatus:
      type: string
      enum: [invited, active, disabled]
    ProjectRole:
      type: string
      description: Owner is assigned at project creation and cannot be removed or changed through member mutations. Admin is the protocol value for Maintainer.
      enum: [owner, admin, member]
    UserRef:
      type: object
      required: [user_id, email, display_name, avatar_url, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          format: uri
        role:
          type: string
    OrgRef:
      type: object
      required: [org_id, name]
      properties:
        org_id:
          type: string
        name:
          type: string
