openapi: 3.1.0
info:
  title: clumsies Public API
  version: 1.0.0
  summary: Public Server API for Desktop and CLI.
servers:
  - url: https://server.clumsies.local
security:
  - bearerAuth: []
paths:
  /api/v1/me/inbox:
    get:
      operationId: listInbox
      summary: List personal notifications with current project access checks.
      description: Includes read and archived subjects. Pages use stable subject keys; clients sort by occurred_at and refresh the complete collection.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Accessible personal notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: [string, "null"] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [notification_id, project_id, project_name, kind, target_id, title, actor_name, body, previous_role, new_role, can_open_project, version, read_version, archived_version, needs_action, review_status, occurred_at]
                      properties:
                        notification_id: { type: string }
                        project_id: { type: [string, "null"] }
                        project_name: { type: [string, "null"] }
                        kind: { type: string, enum: [review_requested, review_comment, review_approved, review_rejected, review_merged, shared_update, welcome, project_joined, project_removed, project_role_changed, org_role_changed] }
                        target_id: { type: string }
                        title: { type: string }
                        actor_name: { type: [string, "null"] }
                        body: { type: [string, "null"], description: Original Markdown content for a welcome message. }
                        previous_role: { type: [string, "null"] }
                        new_role: { type: [string, "null"] }
                        can_open_project: { type: boolean, description: Current access to the referenced project; removal notices never offer navigation. }
                        version: { type: integer, minimum: 1 }
                        read_version: { type: integer, minimum: 0 }
                        archived_version: { type: integer, minimum: 0 }
                        needs_action: { type: boolean }
                        review_status: { type: [string, "null"] }
                        occurred_at: { type: string, format: date-time }
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/inbox/{notification_id}:
    patch:
      operationId: updateInboxReceipt
      summary: Acknowledge only the notification version actually displayed.
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, action]
              properties:
                version: { type: integer, minimum: 1 }
                action: { type: string, enum: [read, unread, archive, restore] }
      responses:
        "200":
          description: Receipt persisted without changing the source business object.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean }
        default:
          $ref: "#/components/responses/Error"
  /oauth2/authorization/oidc:
    get:
      operationId: beginOidcAuthorization
      summary: Begin organization OIDC authorization for a clumsies client.
      security: []
      parameters:
        - name: client_kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ClientKind"
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          schema:
            type: string
        - name: login_hint
          in: query
          schema:
            type: string
            format: email
      responses:
        "302":
          description: Redirect to the configured OIDC authorization endpoint.
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /login/oauth2/code/oidc:
    get:
      operationId: completeOidcAuthorization
      summary: Complete the organization OIDC callback and redirect to the requesting client.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the validated client callback URI.
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/token:
    post:
      operationId: createAuthToken
      summary: Exchange an authorization code or refresh token for clumsies tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      summary: Revoke the current session.
      responses:
        "200":
          description: Session revocation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Read the current user bootstrap payload.
      responses:
        "200":
          description: Current user, organization, projects, and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects accessible to the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project.
      description: Any authenticated organization member can create a project. The creator becomes its project admin.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project.
          headers:
            Location:
              description: Canonical URL of the created project.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Read a project.
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      summary: Update project metadata.
      description: Requires project membership and either project admin or organization owner/admin authority.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project.
      description: Requires project membership and either project admin or organization owner/admin authority.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: List Project members.
      responses:
        "200":
          description: Project members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles:
    get:
      operationId: listPersonalBundles
      summary: List personal Bundles owned by the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Personal Bundle page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPersonalBundle
      summary: Create a user-owned personal Bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleRequest"
      responses:
        "200":
          description: Created personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles/{bundle_id}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getPersonalBundle
      summary: Read a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Personal Bundle detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePersonalBundle
      summary: Update a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleUpdateRequest"
      responses:
        "200":
          description: Updated personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePersonalBundle
      summary: Delete a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/memory-statistics:
    get:
      operationId: orgMemoryStatistics
      summary: Published organization inventory and history.
      description: Counts use published snapshots, excluding draft overlays. Retrieval telemetry is local to each daemon. Historical days before the first retained commit are null. Project selection changes count as snapshot additions/removals.
      parameters:
        - name: days
          in: query
          required: true
          schema: {type: integer, enum: [7, 30, 90]}
        - name: time_zone
          in: query
          required: true
          schema: {type: string, example: Asia/Shanghai, maxLength: 100}
      responses:
        "200":
          description: Complete aggregate statistics for the authenticated scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStatistics"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/memory-statistics:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: projectMemoryStatistics
      summary: Published project inventory, including selected organization memory.
      description: Counts use published snapshots, excluding draft overlays. Retrieval telemetry is local to each daemon. Historical days before the first retained commit are null. Project selection changes count as snapshot additions/removals.
      parameters:
        - name: days
          in: query
          required: true
          schema: {type: integer, enum: [7, 30, 90]}
        - name: time_zone
          in: query
          required: true
          schema: {type: string, example: Asia/Shanghai, maxLength: 100}
      responses:
        "200":
          description: Complete aggregate statistics for the authenticated scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStatistics"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/memories:
    get:
      operationId: listOrgMemories
      summary: List organization memories.
      responses:
        "200":
          description: Organization memory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getOrgMemory
      summary: Read an organization memory.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Organization memory detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/memories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMemories
      summary: List project memories.
      responses:
        "200":
          description: Project memory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getProjectMemory
      summary: Read a project memory.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Project memory detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/org-selections:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectOrgSelection
      summary: Read organization resources selected by a project.
      responses:
        "200":
          description: Project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceProjectOrgSelection
      summary: Replace organization resources selected by a project.
      description: Requires project membership and either project admin or organization owner/admin authority.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProjectOrgSelectionRequest"
      responses:
        "200":
          description: Updated project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts:
    get:
      operationId: listDrafts
      summary: List current user's personal drafts.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Draft page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDraft
      summary: Create a personal draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "200":
          description: Created draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: getDraft
      summary: Read a personal draft.
      responses:
        "200":
          description: Draft detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDraft
      summary: Update draft metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDraft
      summary: Discard a personal draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/operations:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: appendDraftOperation
      summary: Append an operation to a personal draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendDraftOperationRequest"
      responses:
        "200":
          description: Draft after appending the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/reconciliation-candidates:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: createDraftReconciliationCandidate
      summary: Compute an immutable reconciliation candidate against the latest target Ref without changing the draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftReconciliationCandidateRequest"
      responses:
        "200":
          description: Canonical reconciliation candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftReconciliationCandidate"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/reconciliation-candidates/{candidate_id}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDraftReconciliationCandidate
      summary: Read an immutable reconciliation candidate and its current validity.
      responses:
        "200":
          description: Reconciliation candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftReconciliationCandidate"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/rebases:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: createDraftRebase
      summary: Explicitly apply a confirmed reconciliation result as a new recoverable draft revision.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRebaseRequest"
      responses:
        "200":
          description: Applied draft rebase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRebaseResult"
        "412":
          description: The target Ref changed before the candidate was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/draft-events:
    get:
      operationId: listDraftEvents
      summary: Read draft sync events.
      parameters:
        - name: after_cursor
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Draft sync events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEventListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/draft-operation-batches:
    post:
      operationId: createDraftOperationBatch
      summary: Submit local draft operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftOperationBatchRequest"
      responses:
        "200":
          description: Accepted draft operations and new sync cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftOperationBatchResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews:
    get:
      operationId: listReviews
      summary: List reviews.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Review page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createReview
      summary: Create a review from a draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "200":
          description: Created review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      operationId: getReview
      summary: Read a review.
      responses:
        "200":
          description: Review detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/comments:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      operationId: listReviewComments
      summary: List review comments.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Review comment page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCommentListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createReviewComment
      summary: Add a review comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewCommentRequest"
      responses:
        "200":
          description: Created review comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/update-plans:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewUpdatePlan
      summary: Prepare every behind file in a Review against the same shared reference.
      description: Author only. Captures ordered membership and revisions, creates reconciliation candidates, and supplies diff3 text for content conflicts without changing proposal content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewUpdatePlanRequest"
      responses:
        "200":
          description: Complete Review snapshot and candidates for its behind files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewUpdatePlan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/auto-rebases:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewAutoRebase
      summary: Save conflict-free file updates without requiring a manual save.
      description: The author or an organization owner/admin with access to the carrying Project may trigger this operation. Locks the Review and its proposals, checks expected_review_version, and applies only server-computed clean results against one locked remote reference. Conflicting proposals remain unchanged and are returned as candidates. All clean updates and their audit records commit together; no approval or publication occurs. Repeating against the returned revision does not reapply saved updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewUpdatePlanRequest"
      responses:
        "200":
          description: Saved Review snapshot and remaining conflict candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewUpdatePlan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/updates:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewUpdate
      summary: Apply all inspected Review updates atomically, without publishing.
      description: Author only. Requires the complete ordered draft set, its versions, and candidates for behind files. Validates If-Match against the planned shared reference. Any failure rolls back all file updates and approval changes.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewUpdateRequest"
      responses:
        "200":
          description: Updated Review, still awaiting approval or resubmission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        "409":
          description: A Review, Draft, or reconciliation candidate changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The shared reference changed after the plan was prepared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/decisions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewDecision
      summary: Create an organization-authorized review decision.
      description: Requires the caller to be an Organization owner or administrator and a member of the carrying Project. New clients use this endpoint for rejection; the approved decision value remains wire-compatible for older two-step clients, while current clients approve atomically through the merge endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewDecisionRequest"
      responses:
        "200":
          description: Review and draft after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/submissions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewSubmission
      summary: Reconcile when required and resubmit an edited draft to its rejected review.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewSubmissionRequest"
      responses:
        "200":
          description: Reopened review and resubmitted draft, atomically rebased when confirmed per-Draft candidates were supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        "409":
          description: The source draft requires explicit reconciliation with the current Ref.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The If-Match Ref is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/merges:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewMerge
      summary: Atomically approve and merge an open review, or merge a historical approved review.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewMergeRequest"
      responses:
        "200":
          description: Atomic approval and merge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMergeResult"
        "409":
          description: The source draft requires explicit reconciliation with the current Ref.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The If-Match Ref is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/commits:
    get:
      operationId: listOrgCommits
      summary: List organization external-memory commits.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization commit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/commit-state:
    get:
      operationId: getOrgCommitState
      summary: Read organization commit update state.
      parameters:
        - name: local_commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Organization commit update state.
          headers:
            ETag:
              description: Current organization refs/heads/main commit ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/commits:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectCommits
      summary: List project external-memory commits.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project commit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/commit-state:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectCommitState
      summary: Read project commit update state.
      parameters:
        - name: local_commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project commit update state.
          headers:
            ETag:
              description: Current project refs/heads/main commit ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/commits/{commit_id}:
    parameters:
      - $ref: "#/components/parameters/CommitId"
    get:
      operationId: getCommit
      summary: Download or read an external-memory commit payload.
      responses:
        "200":
          description: Commit payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPayload"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
    CommitId:
      name: commit_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    TokenRequest:
      type: object
      oneOf:
        - required: [grant_type, code, redirect_uri, code_verifier]
        - required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
        - org
        - capabilities
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/UserRef"
        org:
          $ref: "#/components/schemas/OrgRef"
        capabilities:
          description: Includes project:create for organization members; admin:write remains restricted to organization owners/admins.
          type: array
          items:
            type: string
    SessionRevoked:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    MeResponse:
      type: object
      required: [user, org, projects, default_project_id, capabilities]
      properties:
        user:
          $ref: "#/components/schemas/UserRef"
        org:
          $ref: "#/components/schemas/OrgRef"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRef"
        default_project_id:
          type: [string, "null"]
        capabilities:
          type: array
          items:
            type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ProjectListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    Project:
      type: object
      required: [project_id, name, description, revision, created_at, updated_at]
      properties:
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectRef:
      type: object
      required: [project_id, name, role]
      properties:
        project_id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
    PersonalBundleRequest:
      type: object
      description: A personal selection of active Hub memory from the current organization.
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        resource_ids:
          type: array
          description: Active organization-scoped Memory ids.
          items:
            type: string
    PersonalBundleUpdateRequest:
      type: object
      description: Updates a personal selection of active Hub memory from the current organization.
      properties:
        name:
          type: string
        description:
          type: string
        resource_ids:
          type: array
          description: Active organization-scoped Memory ids.
          items:
            type: string
    PersonalBundleListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBundleMeta"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    PersonalBundleDetail:
      type: object
      required: [bundle, memories, etag]
      properties:
        bundle:
          $ref: "#/components/schemas/PersonalBundleMeta"
        memories:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMeta"
        etag:
          type: string
    PersonalBundleMeta:
      type: object
      required:
        - bundle_id
        - owner_user_id
        - name
        - description
        - resource_count
        - revision
        - created_at
        - updated_at
      properties:
        bundle_id:
          type: string
        owner_user_id:
          type: string
        name:
          type: string
        description:
          type: string
        resource_count:
          type: integer
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMeta"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    MemoryDetail:
      type: object
      required: [memory, content, etag]
      properties:
        memory:
          $ref: "#/components/schemas/MemoryMeta"
        content:
          type: string
        etag:
          type: string
    ReplaceProjectOrgSelectionRequest:
      type: object
      properties:
        resource_ids:
          type: array
          items:
            type: string
    DraftListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Draft"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    CreateDraftRequest:
      type: object
      required: [daemon_installation_id, project_id, title, resource]
      properties:
        daemon_installation_id:
          type: string
        project_id:
          type: string
          description: Project that will carry the Draft and its pre-merge Effective Memory overlay; it is not an Organization Project.
        base_commit_id:
          type: [string, "null"]
        title:
          type: string
        description:
          type: string
        resource:
          $ref: "#/components/schemas/DraftResourceRef"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DraftOperationInput"
    UpdateDraftRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
    AppendDraftOperationRequest:
      $ref: "#/components/schemas/DraftOperationInput"
    DraftDetail:
      type: object
      required: [draft, operations, sync_state]
      properties:
        draft:
          $ref: "#/components/schemas/Draft"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DraftOperation"
        sync_state:
          $ref: "#/components/schemas/DraftSyncState"
    Draft:
      type: object
      required:
        - draft_id
        - project_id
        - base_commit_id
        - author
        - title
        - description
        - resource
        - status
        - coordination
        - version
        - created_at
        - updated_at
      properties:
        draft_id:
          type: string
        project_id:
          type: string
          description: Project carrying the Draft and its pre-merge Effective Memory overlay; it is not an Organization Project.
        base_commit_id:
          type: [string, "null"]
        author:
          $ref: "#/components/schemas/UserRef"
        title:
          type: string
        description:
          type: string
        resource:
          $ref: "#/components/schemas/DraftResourceRef"
        status:
          $ref: "#/components/schemas/DraftStatus"
        coordination:
          $ref: "#/components/schemas/DraftCoordination"
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DraftOperation:
      allOf:
        - $ref: "#/components/schemas/DraftOperationInput"
        - type: object
          required: [operation_id, created_at]
          properties:
            operation_id:
              type: string
            created_at:
              type: string
              format: date-time
    DraftOperationInput:
      type: object
      required: [action, resource]
      properties:
        action:
          $ref: "#/components/schemas/DraftOperationAction"
        resource:
          $ref: "#/components/schemas/DraftResourceRef"
        content:
          oneOf:
            - $ref: "#/components/schemas/DraftResourceContent"
            - type: "null"
        new_path:
          type: [string, "null"]
          minLength: 1
          description: Portable normalized relative path used by a rename operation.
    DraftResourceContent:
      type: object
      required: [content]
      properties:
        description:
          type: [string, "null"]
          description: Optional semantic summary updated with the content.
        content:
          type: string
          minLength: 1
    DraftResourceRef:
      type: object
      required: [scope, id, path]
      properties:
        scope:
          type: string
          enum: [org, project]
          description: Authority namespace the proposal targets if its Review is merged; Draft ownership is defined by its carrying project_id.
        id:
          type: [string, "null"]
        path:
          type: [string, "null"]
          minLength: 1
          description: Portable normalized relative resource path using slash separators.
    DraftSyncState:
      type: object
      required: [status, server_cursor, daemon_installation_id]
      properties:
        status:
          type: string
          enum: [synced, pending, failed]
        server_cursor:
          type: [string, "null"]
        daemon_installation_id:
          type: [string, "null"]
    DraftCoordination:
      type: object
      required: [freshness, current_commit_id, has_upstream_resource_changes, reconciliation, candidate_id, auto_rebased]
      properties:
        freshness:
          $ref: "#/components/schemas/DraftFreshness"
        current_commit_id:
          type: [string, "null"]
        has_upstream_resource_changes:
          type: boolean
          description: Whether the Draft resource changed between its Base Commit and the current target Ref.
        reconciliation:
          $ref: "#/components/schemas/DraftReconciliationStatus"
        candidate_id:
          type: [string, "null"]
        auto_rebased:
          type: boolean
          description: The current Draft revision was persisted from a conflict-free reconciliation and remains based on the current Ref. At Review level, true when any member has this status; a remaining conflict takes precedence in the UI.
    CreateDraftReconciliationCandidateRequest:
      type: object
      required: [expected_draft_version]
      properties:
        expected_draft_version:
          type: integer
    ReconciliationResourceState:
      type: object
      required: [exists, resource, content]
      properties:
        exists:
          type: boolean
        resource:
          $ref: "#/components/schemas/DraftResourceRef"
        content:
          oneOf:
            - $ref: "#/components/schemas/DraftResourceContent"
            - type: "null"
    ReconciliationConflict:
      type: object
      required: [kind, field, base, current, draft]
      properties:
        kind:
          type: string
          enum: [content, path, existence, path_occupied]
        field:
          type: string
        base:
          type: [string, "null"]
        current:
          type: [string, "null"]
        draft:
          type: [string, "null"]
    DraftReconciliationCandidate:
      type: object
      required:
        - candidate_id
        - draft_id
        - draft_version
        - base_commit_id
        - current_commit_id
        - status
        - base_state
        - current_state
        - draft_state
        - proposed_state
        - conflicts
        - merge_preview
        - result_hash
        - valid
        - created_at
        - invalidated_at
      properties:
        candidate_id:
          type: string
        draft_id:
          type: string
        draft_version:
          type: integer
        base_commit_id:
          type: [string, "null"]
        current_commit_id:
          type: [string, "null"]
        status:
          type: string
          enum: [clean, conflicts]
        base_state:
          $ref: "#/components/schemas/ReconciliationResourceState"
        current_state:
          $ref: "#/components/schemas/ReconciliationResourceState"
        draft_state:
          $ref: "#/components/schemas/ReconciliationResourceState"
        proposed_state:
          oneOf:
            - $ref: "#/components/schemas/ReconciliationResourceState"
            - type: "null"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationConflict"
        merge_preview:
          description: Partial merge retaining automatic content and path changes; conflicting fields still require an explicit user choice.
          oneOf:
            - $ref: "#/components/schemas/ReconciliationMergePreview"
            - type: "null"
        result_hash:
          type: [string, "null"]
        valid:
          type: boolean
        created_at:
          type: string
          format: date-time
        invalidated_at:
          type: [string, "null"]
          format: date-time
    ReconciliationMergePreview:
      type: object
      required: [state, marker_length]
      properties:
        state:
          $ref: "#/components/schemas/ReconciliationResourceState"
        marker_length:
          type: integer
          minimum: 7
          description: Collision-free diff3 marker length; ours is Remote, original is base, and theirs is Draft.
    CreateDraftRebaseRequest:
      type: object
      required: [candidate_id, expected_draft_version]
      properties:
        candidate_id:
          type: string
        expected_draft_version:
          type: integer
        resolved_state:
          description: Required complete user-resolved result for a conflicts candidate; must be omitted for a clean candidate so the Server applies its canonical proposed state.
          oneOf:
            - $ref: "#/components/schemas/ReconciliationResourceState"
            - type: "null"
    DraftRebaseResult:
      type: object
      required: [rebase_id, previous_revision_id, draft, review, approval_invalidated]
      properties:
        rebase_id:
          type: string
        previous_revision_id:
          type: string
        draft:
          $ref: "#/components/schemas/DraftDetail"
        review:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
        approval_invalidated:
          type: boolean
    DraftEventListResponse:
      type: object
      required: [events, next_cursor, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/DraftEvent"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    DraftEvent:
      type: object
      required:
        - event_id
        - draft_id
        - project_id
        - event_type
        - version
        - daemon_installation_id
        - created_at
      properties:
        event_id:
          type: string
        draft_id:
          type: string
        project_id:
          type: string
        event_type:
          type: string
          enum: [created, updated, operation_appended, discarded, submitted, reopened, rebased, merged]
        version:
          type: integer
        daemon_installation_id:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    DraftOperationBatchRequest:
      type: object
      required: [daemon_installation_id, operations]
      properties:
        daemon_installation_id:
          type: string
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DraftOperationBatchItem"
    DraftOperationBatchItem:
      type: object
      required: [local_operation_id, draft_id, expected_draft_version, operation]
      properties:
        local_operation_id:
          type: string
        draft_id:
          type: string
        expected_draft_version:
          type: integer
        operation:
          $ref: "#/components/schemas/DraftOperationInput"
    DraftOperationBatchResponse:
      type: object
      required: [accepted_operations, cursor]
      properties:
        accepted_operations:
          type: array
          items:
            type: string
        cursor:
          type: string
    ReviewListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    CreateReviewRequest:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReviewDraftRequest"
        title:
          type: string
        description:
          type: string
    CreateReviewSubmissionRequest:
      type: object
      required: [expected_review_version, drafts]
      properties:
        expected_review_version:
          type: integer
        drafts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReviewDraftRequest"
        title:
          type: string
        description:
          type: string
    CreateReviewUpdatePlanRequest:
      type: object
      required: [expected_review_version]
      properties:
        expected_review_version:
          type: integer
    ReviewUpdatePlan:
      type: object
      required: [detail, candidates]
      properties:
        detail:
          $ref: "#/components/schemas/ReviewDetail"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/DraftReconciliationCandidate"
    CreateReviewUpdateRequest:
      type: object
      required: [expected_review_version, drafts]
      properties:
        expected_review_version:
          type: integer
        drafts:
          type: array
          minItems: 1
          description: Every member of the inspected Review in its original order, including current files.
          items:
            $ref: "#/components/schemas/ReviewDraftRequest"
    ReviewDraftRequest:
      type: object
      required: [draft_id, expected_draft_version]
      properties:
        draft_id:
          type: string
        expected_draft_version:
          type: integer
        candidate_id:
          type: string
          description: Confirmed reconciliation candidate to apply atomically for this Draft when it is behind.
        resolved_state:
          description: Required complete user-resolved result for this Draft's conflicts candidate; must be omitted for a clean candidate.
          oneOf:
            - $ref: "#/components/schemas/ReconciliationResourceState"
            - type: "null"
    ReviewDraftDetail:
      type: object
      required: [draft, operations]
      properties:
        draft:
          $ref: "#/components/schemas/Draft"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DraftOperation"
    ReviewDetail:
      type: object
      required: [review, draft, operations, drafts, comments]
      properties:
        review:
          $ref: "#/components/schemas/Review"
        draft:
          $ref: "#/components/schemas/Draft"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DraftOperation"
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/ReviewDraftDetail"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/ReviewComment"
    Review:
      type: object
      required:
        - review_id
        - project_id
        - draft_id
        - draft_ids
        - author
        - title
        - description
        - status
        - version
        - decision_body
        - approved_result_hash
        - coordination
        - created_at
        - updated_at
      properties:
        review_id:
          type: string
        project_id:
          type: string
          description: Project carrying the reviewed Draft; the Draft resource scope identifies the authority target.
        draft_id:
          type: string
        draft_ids:
          type: array
          items:
            type: string
        author:
          $ref: "#/components/schemas/UserRef"
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ReviewStatus"
        version:
          type: integer
        decision_body:
          type: [string, "null"]
        approved_result_hash:
          type: [string, "null"]
        decided_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        decided_at:
          type: [string, "null"]
          format: date-time
        coordination:
          $ref: "#/components/schemas/DraftCoordination"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewCommentListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewComment"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    CreateReviewCommentRequest:
      type: object
      required: [body, expected_review_version]
      properties:
        body:
          type: string
        expected_review_version:
          type: integer
        anchor_path:
          type: [string, "null"]
        anchor_line:
          type: [integer, "null"]
    ReviewComment:
      type: object
      required:
        [comment_id, review_id, author, body, anchor_path, anchor_line, review_version, created_at]
      properties:
        comment_id:
          type: string
        review_id:
          type: string
        author:
          $ref: "#/components/schemas/UserRef"
        body:
          type: string
        anchor_path:
          type: [string, "null"]
        anchor_line:
          type: [integer, "null"]
        review_version:
          type: integer
        created_at:
          type: string
          format: date-time
    CreateReviewDecisionRequest:
      type: object
      required: [decision, expected_review_version]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        expected_review_version:
          type: integer
        body:
          type: string
    CreateReviewMergeRequest:
      type: object
      required: [expected_review_version]
      properties:
        expected_review_version:
          type: integer
    ReviewMergeResult:
      type: object
      required: [review, commit_id, applied_operation_count]
      properties:
        review:
          $ref: "#/components/schemas/Review"
        commit_id:
          type: [string, "null"]
        applied_operation_count:
          type: integer
    MemoryMeta:
      type: object
      required: [memory_id, scope, project_id, path, name, description, content_hash, status, updated_at]
      properties:
        memory_id:
          type: string
        scope:
          $ref: "#/components/schemas/ResourceScope"
        project_id:
          type: [string, "null"]
        path:
          type: string
        name:
          type: string
        description:
          type: string
          description: Agent-generated semantic summary used for retrieval and quick understanding.
        content_hash:
          type: string
        status:
          $ref: "#/components/schemas/ResourceStatus"
        updated_at:
          type: string
          format: date-time
    CommitListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Commit"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    CommitStateResponse:
      type: object
      required: [update_available, ref, latest, download_url, incremental_supported]
      properties:
        update_available:
          type: boolean
        ref:
          $ref: "#/components/schemas/Ref"
        latest:
          oneOf:
            - $ref: "#/components/schemas/Commit"
            - type: "null"
        download_url:
          type: [string, "null"]
        incremental_supported:
          type: boolean
    CommitPayload:
      type: object
      required: [commit, tree, blobs, project_org_selection]
      properties:
        commit:
          $ref: "#/components/schemas/Commit"
        tree:
          $ref: "#/components/schemas/Tree"
        blobs:
          type: array
          items:
            $ref: "#/components/schemas/Blob"
        project_org_selection:
          oneOf:
            - $ref: "#/components/schemas/ProjectOrgSelection"
            - type: "null"
    Commit:
      type: object
      required: [commit_id, scope, org_id, project_id, tree_id, parent_commit_id, version, created_at]
      properties:
        commit_id:
          type: string
        scope:
          $ref: "#/components/schemas/CommitScope"
        org_id:
          type: string
        project_id:
          type: [string, "null"]
        tree_id:
          type: string
        parent_commit_id:
          type: [string, "null"]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    Ref:
      type: object
      required: [name, scope, org_id, project_id, commit_id, updated_at]
      properties:
        name:
          type: string
          enum: [refs/heads/main]
        scope:
          $ref: "#/components/schemas/CommitScope"
        org_id:
          type: string
        project_id:
          type: [string, "null"]
        commit_id:
          type: [string, "null"]
        updated_at:
          type: string
          format: date-time
    Tree:
      type: object
      required: [tree_id, entries]
      properties:
        tree_id:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TreeEntry"
    TreeEntry:
      type: object
      required: [id, type, scope, project_id, path, blob_id, source]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [rule, context, workflow, project_org_selection]
        scope:
          type: string
          enum: [org, project, daemon]
        project_id:
          type: [string, "null"]
        path:
          type: [string, "null"]
        blob_id:
          type: string
        source:
          type: string
          enum: [org, project, selected_org, bootstrap, config]
    Blob:
      type: object
      required: [blob_id, content]
      properties:
        blob_id:
          type: string
        content:
          type: string
    ProjectOrgSelection:
      type: object
      required: [project_id, memories, revision]
      properties:
        project_id:
          type: string
        memories:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMeta"
        revision:
          type: integer
    ProjectMemberListResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        page_info:
          $ref: "#/components/schemas/PageInfo"
    ProjectMember:
      type: object
      required: [project_id, user, role, joined_at]
      properties:
        project_id:
          type: string
        user:
          $ref: "#/components/schemas/UserRef"
        role:
          $ref: "#/components/schemas/ProjectRole"
        joined_at:
          type: string
          format: date-time
    ProjectRole:
      type: string
      enum: [member, admin]
    DeleteResult:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    UserRef:
      type: object
      required: [user_id, email, display_name, avatar_url, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          format: uri
        role:
          type: string
    ClientKind:
      type: string
      enum: [desktop, cli]
    OrgRef:
      type: object
      required: [org_id, name]
      properties:
        org_id:
          type: string
        name:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ResourceScope:
      type: string
      enum: [org, project]
    ResourceStatus:
      type: string
      enum: [active, deprecated, archived]
    CommitScope:
      type: string
      enum: [org, project]
    DraftStatus:
      type: string
      enum: [open, submitted, merged, discarded]
    DraftFreshness:
      type: string
      enum: [current, behind]
    DraftReconciliationStatus:
      type: string
      enum: [unknown, clean, conflicts]
    DraftOperationAction:
      type: string
      enum: [create, update, rename, delete]
    ReviewStatus:
      type: string
      enum: [open, approved, rejected, merged]

    MemoryStatistics:
      type: object
      required: [generated_at, day_bounds, recency_starts, project_ids, resources, memory_count, added_count, updated_count, deleted_count, days, change_buckets, open_drafts, submitted_drafts]
      properties:
        generated_at: {type: integer, format: int64, description: Server observation time in Unix seconds.}
        day_bounds:
          type: array
          description: Local calendar midnights as Unix seconds including an exclusive final boundary; DST-aware.
          items: {type: integer, format: int64}
        recency_starts:
          type: array
          description: Starts of the last 7, 30 and 90 local calendar days.
          items: {type: integer, format: int64}
          minItems: 3
          maxItems: 3
        project_ids:
          type: array
          description: Only projects visible to the current user in this scope.
          items: {type: string}
        resources:
          type: array
          items:
            type: object
            required: [id, title, path]
            properties:
              id: {type: string}
              title: {type: string}
              path: {type: string}
        memory_count: {type: integer, minimum: 0}
        added_count: {type: integer, minimum: 0}
        updated_count: {type: integer, minimum: 0}
        deleted_count: {type: integer, minimum: 0}
        open_drafts: {type: integer, minimum: 0, description: Server-known open and conflicted drafts in visible projects.}
        submitted_drafts: {type: integer, minimum: 0}
        days:
          type: array
          items:
            type: object
            required: [date, memory_count]
            properties:
              date: {type: integer, format: int64}
              memory_count: {type: integer, minimum: 0, nullable: true}
        change_buckets:
          type: array
          items:
            type: object
            required: [date, kind, count]
            properties:
              date: {type: integer, format: int64}
              kind: {type: string, enum: [added, updated, deleted]}
              count: {type: integer, minimum: 0}
