[package]
name = "clumsiesd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clumsiesd"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
fastembed = { version = "5.17.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
hex = "0.4.3"
libc = "0.2.177"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", features = ["gzip", "json", "rustls", "system-proxy"], default-features = false }
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "uuid"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
toml_edit = "0.25.13"
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSError", "NSString", "NSURL"] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[dev-dependencies]
axum = "0.8.9"
server = { path = "../server" }
tempfile = "3.27.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
