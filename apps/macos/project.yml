name: Clumsies
options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLUMSIES_APP_PRODUCT_NAME: Clumsies
    CLUMSIES_APP_BUNDLE_IDENTIFIER: ai.clumsies.desktop
    CLUMSIES_APP_DISPLAY_NAME: Clumsies
    CLUMSIES_DEV_INSTANCE_ID: ""
    CLUMSIES_DAEMON_ROOT: ""
    CLUMSIES_DAEMON_CACHE_DIR: ""
    CLUMSIES_DAEMON_LOG_DIR: ""
    CLUMSIES_DAEMON_LAUNCH_AGENTS_DIR: ""
    CLUMSIES_SERVER_URL: https://app.clumsies.ai
    CLUMSIES_CODEX_HOME: ""
    CLUMSIES_UPDATE_FEED_URL: https://github.com/lilhammerfun/clumsies/releases/download/macos-updates/appcast.xml
  configs:
    Debug:
      CLUMSIES_UPDATE_FEED_URL: https://github.com/lilhammerfun/clumsies/releases/download/macos-updates/preview-appcast.xml
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  Clumsies:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/CLUMSIES.md
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/MemoryStarter
        type: folder
        buildPhase: resources
      - path: Resources/FileSymbols
        type: folder
        buildPhase: resources
      - path: Resources/Octicons
        type: folder
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: $(CLUMSIES_APP_DISPLAY_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CLUMSIES_APP_DISPLAY_NAME: $(CLUMSIES_APP_DISPLAY_NAME)
        CLUMSIES_DEV_INSTANCE_ID: $(CLUMSIES_DEV_INSTANCE_ID)
        CLUMSIES_DAEMON_ROOT: $(CLUMSIES_DAEMON_ROOT)
        CLUMSIES_DAEMON_CACHE_DIR: $(CLUMSIES_DAEMON_CACHE_DIR)
        CLUMSIES_DAEMON_LOG_DIR: $(CLUMSIES_DAEMON_LOG_DIR)
        CLUMSIES_DAEMON_LAUNCH_AGENTS_DIR: $(CLUMSIES_DAEMON_LAUNCH_AGENTS_DIR)
        CLUMSIES_SERVER_URL: $(CLUMSIES_SERVER_URL)
        CLUMSIES_CODEX_HOME: $(CLUMSIES_CODEX_HOME)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Clumsies Lab
        NSPrincipalClass: NSApplication
        SUFeedURL: $(CLUMSIES_UPDATE_FEED_URL)
        SUVerifyUpdateBeforeExtraction: true
        SUPublicEDKey: oCAiBe/ez4wochO1I9ziO1uCEpmES+e7ypC74HJwIvw=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLUMSIES_APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(CLUMSIES_APP_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: Clumsies
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
          ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: MarkdownUI
      - package: Sparkle
    postBuildScripts:
      - name: Embed clumsiesd
        path: Scripts/embed-daemon.sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/clumsiesd
  ClumsiesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Clumsies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.clumsies.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(CLUMSIES_APP_PRODUCT_NAME).app/Contents/MacOS/$(CLUMSIES_APP_PRODUCT_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Clumsies:
    build:
      targets:
        Clumsies: all
        ClumsiesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClumsiesTests
      environmentVariables:
        CLUMSIES_SKIP_DAEMON_BUILD: "1"
    archive:
      config: Release
  ClumsiesLiveTests:
    build:
      targets:
        Clumsies: all
        ClumsiesTests: [test]
    test:
      config: Debug
      targets:
        - ClumsiesTests
      environmentVariables:
        CLUMSIES_RUN_LIVE_TESTS: "1"
        CLUMSIES_SKIP_DAEMON_BUILD: "1"
    management:
      isShown: false
