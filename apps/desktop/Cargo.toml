[package]
name = "desktop"
version = "0.20.5"
edition = "2024"
publish = false
description = "Clumsies desktop client for Windows and Linux."

[[bin]]
name = "clumsies-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6.6"
# Line-level diffing for the draft and review views.
similar = "2"
# The daemon owns the local wire protocol. Depending on it keeps one
# definition of that contract instead of a copy that drifts.
clumsiesd = { path = "../../crates/clumsiesd" }
# The Server's API is not the daemon's, so the fields this client reads from it
# are described here, not shared.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signing in talks to the Server directly, because the daemon has no session
# yet. The versions are the ones the daemon already builds.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
base64 = "0.22.1"
sha2 = "0.10.9"
uuid = { version = "1.23.4", features = ["v4"] }
# The Dashboard is bucketed by the Server in the reader's own time zone and
# answered in Unix seconds, so the client has to name that zone and turn the
# seconds back into local calendar dates. Both crates are already in the
# workspace's lock file, through the Server's own use of them.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.65"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
# Pass browser URLs as data and suppress launcher console windows.
open = "5.4.4"
# Find the Codex desktop app even when its bundled CLI is not on PATH.
windows = { version = "0.62.2", features = ["ApplicationModel", "Management_Deployment", "Storage"] }

# Explorer, the taskbar and every shortcut take a Windows program's icon from a
# resource inside the executable, so the client needs a resource compiler on
# Windows and nothing anywhere else.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
