[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Clumsies desktop client for Windows and Linux."

[[bin]]
name = "clumsies-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6.6"
# Line-level diffing for the draft and review views.
similar = "2"
# The daemon's wire protocol is JSON; see src/protocol.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
